<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meshingress Workflow Studio</title>

  <style>
    :root {
      --panel: #0f1117;
      --card: #171a22;
      --card-2: #1d212b;
      --text: #edf0f7;
      --muted: #8f98aa;
      --border: #2b3140;
      --accent: #7c8cff;
      --accent-text: #ffffff;
      --accent-bg: rgba(124, 140, 255, 0.14);
      --accent-bg-subtle: rgba(124, 140, 255, 0.08);
      --success: #5ccf9a;
      --danger: #ff758f;
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      --explorer-width: 245px;
      --inspector-width: 330px;
      --scrollbar-thumb: rgba(237, 240, 247, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    *::-webkit-scrollbar-thumb {
      border: 0;
      border-radius: 0;
      background: var(--scrollbar-thumb);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--panel);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .studio-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
    }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 58px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex: 0 0 auto;
    }

    .brand-wrap,
    .actions,
    .inline-group {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-wrap {
      position: relative;
      z-index: 1;
      padding: 2px;
    }

    .brand {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
      flex: 0 0 auto;
    }

    .brand-switcher {
      width: 280px;
      height: 34px;
      overflow: visible;
    }

    .brand-switcher-track {
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 190ms ease;
      will-change: transform;
    }

    .title-wrap {
      display: flex;
      flex: 0 0 34px;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .brand-menu {
      display: flex;
      flex: 0 0 34px;
      align-items: center;
      gap: 2px;
      visibility: hidden;
      pointer-events: none;
    }

    .brand-wrap:hover .brand-switcher-track,
    .brand-wrap:focus-within .brand-switcher-track,
    .brand-wrap.menu-locked .brand-switcher-track {
      transform: translateY(-40px);
    }

    .brand-wrap:hover .title-wrap,
    .brand-wrap:focus-within .title-wrap,
    .brand-wrap.menu-locked .title-wrap {
      opacity: 0;
    }

    .brand-wrap:hover .brand-menu,
    .brand-wrap:focus-within .brand-menu,
    .brand-wrap.menu-locked .brand-menu {
      visibility: visible;
      pointer-events: auto;
    }

    .brand-menu-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 7px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .brand-menu-item:hover,
    .brand-menu-item:focus-visible {
      outline: none;
      background: var(--accent-bg);
      color: var(--text);
    }

    .brand-menu-entry {
      position: relative;
    }

    .brand-menu-children {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      display: grid;
      min-width: 260px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .brand-menu-entry.is-open .brand-menu-children {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .brand-menu-child {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      align-items: center;
      column-gap: 8px;
      width: 100%;
      padding: 5px 9px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 0.89rem;
      text-align: left;
    }

    .brand-menu-separator {
      height: 1px;
      margin: 5px 4px;
      background: var(--border);
    }

    .brand-menu-child:hover,
    .brand-menu-child:focus-visible {
      outline: none;
      background: var(--accent-bg);
    }

    .svg-filler-square,
    .menu-icon,
    .header-action-icon {
      display: block;
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-switcher-track {
        transition: none;
      }
    }

    .title {
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1;
    }

    .button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 11px;
      background: var(--card-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
    }

    .button:hover {
      border-color: var(--accent);
    }

    .button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    .button.small {
      padding: 5px 8px;
      font-size: 0.75rem;
    }

    .header-action-menu {
      position: relative;
    }

    .header-action-split {
      display: flex;
      align-items: stretch;
    }

    .header-icon-button {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-2);
      color: var(--text);
      cursor: pointer;
    }

    .header-icon-button:hover {
      border-color: var(--accent);
    }

    .header-icon-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .header-icon-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-text);
    }

    .header-action-split .header-icon-button:first-child {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
    }

    .header-action-split .header-icon-button:last-child {
      width: 22px;
      margin-left: -1px;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    .header-action-chevron {
      font-size: 0.72rem;
      line-height: 1;
    }

    .header-action-ellipsis {
      font-size: 1.2rem;
      line-height: 1;
      transform: translateY(-1px);
    }

    .header-action-menu-popover {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;
      z-index: 30;
      min-width: 210px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .header-action-menu.is-open .header-action-menu-popover {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .header-action-menu-item {
      display: flex;
      width: 100%;
      padding: 7px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }

    .header-action-menu-item:hover,
    .header-action-menu-item:focus-visible {
      outline: none;
      background: var(--accent-bg);
    }

    .header-action-menu-separator {
      height: 1px;
      margin: 5px 3px;
      background: var(--border);
    }

    .layout {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns:
        70px var(--explorer-width) 8px minmax(420px, 1fr) 8px var(--inspector-width);
      overflow: hidden;
    }

    .rail {
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 8px;
      border-right: 1px solid var(--border);
      background: var(--card);
    }

    .rail-group {
      display: grid;
      gap: 10px;
    }

    .rail-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 52px;
      min-height: 50px;
      margin: 0 auto;
      border: 1px solid transparent;
      border-radius: 13px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .rail-button:hover {
      border-color: var(--border);
      background: var(--card-2);
      color: var(--text);
    }

    .rail-button.active {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .rail-button.active::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    .rail-icon {
      font-size: 1.16rem;
      font-weight: 800;
      line-height: 1;
    }

    .rail-label {
      margin-top: 4px;
      font-size: 0.61rem;
      font-weight: 700;
    }

    .rail-badge {
      position: absolute;
      right: 2px;
      top: 2px;
      display: grid;
      place-items: center;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 0.58rem;
      font-weight: 800;
    }

    .explorer,
    .right-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--card);
    }

    .explorer {
      border-right: 1px solid var(--border);
    }

    .right-panel {
      border-left: 1px solid var(--border);
    }

    .panel-resizer {
      position: relative;
      min-height: 0;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
      background: transparent;
    }

    .panel-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 2px;
      background: transparent;
      transition: background 120ms ease;
    }

    .panel-resizer:hover::after,
    .panel-resizer.resizing::after {
      background: var(--accent);
    }

    .panel-head {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.045em;
    }

    .panel-body,
    .inspector {
      min-height: 0;
      overflow: auto;
      padding: 11px;
    }

    .search {
      margin-bottom: 10px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 9px;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .list {
      display: grid;
      gap: 5px;
    }

    .group-label {
      margin: 12px 4px 6px;
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.045em;
    }

    .list-item {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .list-item:hover,
    .list-item.selected {
      border-color: var(--border);
      background: var(--card-2);
    }

    .item-icon {
      color: var(--muted);
      font-weight: 800;
      flex: 0 0 auto;
    }

    .item-main {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .item-sub {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.68rem;
    }

    .item-meta {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.65rem;
      text-align: right;
    }

    .vars {
      display: grid;
      gap: 4px;
      margin: 4px 0 9px 24px;
    }

    .var {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 7px;
      border-radius: 8px;
      background: var(--accent-bg-subtle);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.68rem;
      cursor: pointer;
    }

    .var:hover {
      background: var(--accent-bg);
    }

    .center {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr) 190px;
      background: var(--panel);
    }

    .canvas-head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
    }

    .muted {
      color: var(--muted);
    }

    .canvas {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background-image:
        radial-gradient(circle at 0 0, var(--border) 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      background-position: 0 0;
      cursor: default;
      touch-action: none;
    }

    .canvas.panning {
      cursor: grabbing;
    }

    .canvas-stage {
      position: relative;
      width: 1500px;
      height: 1000px;
      transform-origin: 0 0;
      will-change: transform;
    }

    #edge-layer {
      position: absolute;
      inset: 0;
      width: 1500px;
      height: 1000px;
      pointer-events: none;
      overflow: visible;
    }

    .edge {
      fill: none;
      stroke: var(--muted);
      stroke-width: 2;
      opacity: 0.78;
    }

    .edge.active {
      stroke: var(--accent);
      stroke-width: 3;
      opacity: 1;
    }

    .node {
      position: absolute;
      width: 220px;
      min-width: 140px;
      border-radius: 4px;
      box-sizing: border-box;
      border: 0;
      overflow: hidden;
      background: var(--card);
      box-shadow: inset 0 0 0 1px var(--border), 0 9px 26px rgba(0, 0, 0, 0.16);
      user-select: none;
    }

    .node.selected {
      box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px var(--accent-bg), 0 9px 26px rgba(0, 0, 0, 0.16);
    }

    .node.running {
      box-shadow: inset 0 0 0 1px var(--accent), 0 9px 26px rgba(0, 0, 0, 0.16);
    }

    .node-head {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-sizing: border-box;
      height: 40px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .node-head:active,
    .node-head.dragging {
      cursor: grabbing;
    }

    .node-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .node-kind {
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.66rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .node.running .dot {
      background: var(--accent);
    }

    .node.success .dot {
      background: var(--success);
    }

    .node-body {
      /* Half a grid unit above and below keeps each row center on a grid line. */
      padding: 10px 0;
    }

    .node-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-sizing: border-box;
      height: 20px;
      padding: 0 10px;
      font-size: 0.69rem;
      line-height: 1;
    }

    .node-value {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .chip {
      display: inline-flex;
      max-width: 128px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.66rem;
    }

    .port {
      position: absolute;
      top: 14px;
      width: 12px;
      height: 12px;
      border: 2px solid var(--card);
      border-radius: 0;
      background: var(--muted);
    }

    .port.in {
      left: -6px;
    }

    .port.out {
      right: -6px;
    }

    .drawer {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
      background: var(--card);
    }

    .tabs {
      display: flex;
      gap: 2px;
      padding: 0 8px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex: 0 0 auto;
    }

    .tab {
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 8px 9px;
      cursor: pointer;
      font-size: 0.73rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .tab.active {
      border-bottom-color: var(--accent);
      color: var(--text);
    }

    .drawer-body {
      min-height: 0;
      overflow: auto;
      padding: 9px 11px;
    }

    .log-row {
      display: grid;
      grid-template-columns: 72px 92px minmax(0, 1fr);
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
    }

    .log-time {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .field {
      margin-bottom: 11px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .section-heading {
      margin: 14px 0 8px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .box {
      margin-bottom: 8px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.68rem;
    }

    .empty {
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .status-success {
      color: var(--success);
    }

    .status-error {
      color: var(--danger);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns:
          70px var(--explorer-width) 8px minmax(320px, 1fr) 8px var(--inspector-width);
      }
    }

    @media (max-width: 780px) {
      body {
        overflow: auto;
      }

      .studio-shell {
        min-width: 780px;
        min-height: 720px;
      }

      .layout {
        grid-template-columns:
          70px var(--explorer-width) 8px minmax(320px, 1fr) 8px var(--inspector-width);
      }
    }
  </style>
</head>

<body>
  <div class="studio-shell">

                  <button class="brand-menu-child" type="button"><svg class="svg-filler-square" viewBox="0 0 10 10"

                  <button class="brand-menu-child" type="button"><svg class="svg-filler-square" viewBox="0 0 10 10"
                      aria-hidden="true">
                      <rect width="10" height="10" />
                    </svg><span>Keyboard shortcuts</span></button>
                  <div class="brand-menu-separator" role="separator"></div>
                  <button class="brand-menu-child" type="button"><svg class="svg-filler-square" viewBox="0 0 10 10"
                      aria-hidden="true">
                      <rect width="10" height="10" />
                    </svg><span>MCP connection status</span></button>
                  <button class="brand-menu-child" type="button"><svg class="svg-filler-square" viewBox="0 0 10 10"
                      aria-hidden="true">

                  <button class="brand-menu-child" type="button"><svg class="svg-filler-square" viewBox="0 0 10 10"
                      aria-hidden="true">
                      <rect width="10" height="10" />
                    </svg><span>About Meshingress</span></button>
                </div>
              </div>
            </nav>
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="header-action-menu" data-header-action-menu>
          <div class="header-action-split">
            <button id="run-button" class="header-icon-button primary" type="button" aria-label="Run workflow" title="Run workflow">
              <span class="action-icon-slot" aria-hidden="true"></span>
            </button>
            <button id="run-options-toggle" class="header-icon-button primary" type="button" aria-label="Open run options" title="Run options" aria-haspopup="menu" aria-expanded="false" aria-controls="run-options-menu">
              <span class="header-action-chevron" aria-hidden="true">▾</span>
            </button>
          </div>
          <div id="run-options-menu" class="header-action-menu-popover" role="menu" aria-label="Run options">
            <button class="header-action-menu-item" data-header-command="validate" type="button" role="menuitem">Validate workflow</button>
            <button class="header-action-menu-item" data-header-command="debug" type="button" role="menuitem">Debug run</button>
            <button class="header-action-menu-item" data-header-command="run-from-trigger" type="button" role="menuitem">Run from Manual Trigger</button>
            <div class="header-action-menu-separator" role="separator"></div>
            <button class="header-action-menu-item" data-header-command="history" type="button" role="menuitem">Execution history</button>
          </div>
        </div>

        <div class="header-action-menu" data-header-action-menu>
          <button id="runtime-options-toggle" class="header-icon-button" type="button" aria-label="Open runtime configurations" title="Runtime configurations" aria-haspopup="menu" aria-expanded="false" aria-controls="runtime-options-menu">
            <span class="header-action-ellipsis" aria-hidden="true">…</span>
          </button>
          <div id="runtime-options-menu" class="header-action-menu-popover" role="menu" aria-label="Runtime configurations">
            <button class="header-action-menu-item" data-header-command="edit-configurations" type="button" role="menuitem">Edit configurations</button>
            <button class="header-action-menu-item" data-header-command="environment-variables" type="button" role="menuitem">Environment variables</button>
            <button class="header-action-menu-item" data-header-command="runtime-defaults" type="button" role="menuitem">Runtime defaults</button>
            <button class="header-action-menu-item" data-header-command="permissions" type="button" role="menuitem">Permissions and scopes</button>
            <div class="header-action-menu-separator" role="separator"></div>
            <button class="header-action-menu-item" data-header-command="runtime-details" type="button" role="menuitem">View runtime details</button>
          </div>
        </div>
