<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Meshingress Workflow Studio</title>

    <style>
        @font-face {
            font-family: "fixel-pont";
            src: url("./assets/fonts/fixelPont-1-0/fixelPont-1-0/otf/fixelPont-regular.otf") format("opentype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --panel: #0f1117;
            --card: #171a22;
            --card-2: #1d212b;
            --text: #edf0f7;
            --muted: #8f98aa;
            --border: #2b3140;
            --accent: #7c8cff;
            --accent-text: #fff;
            --accent-bg: rgba(124, 140, 255, 0.14);
            --accent-bg-subtle: rgba(124, 140, 255, 0.08);
            --success: #5ccf9a;
            --danger: #ff758f;
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
            --explorer-width: 245px;
            --inspector-width: 330px;
            --scrollbar-thumb: rgba(237, 240, 247, 0.65);
        }

        * {
            box-sizing: border-box;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) transparent;
        }

        *::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }

        *::-webkit-scrollbar-thumb {
            border: 0;
            border-radius: 0;
            background: var(--scrollbar-thumb);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--panel);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .studio-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel);
        }

        .topbar {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            min-height: 58px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            flex: 0 0 auto;
        }

        .brand-wrap,
        .actions,
        .inline-group {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }

        .brand-wrap {
            position: relative;
            z-index: 1;
            padding: 2px;
        }

        .brand {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: var(--accent);
            color: var(--accent-text);
            font-weight: 800;
            flex: 0 0 auto;
        }

        .brand-switcher {
            width: 280px;
            height: 34px;
            overflow: visible;
        }

        .brand-switcher-track {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 190ms ease;
            will-change: transform;
        }

        .title-wrap {
            display: flex;
            flex: 0 0 34px;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .brand-menu {
            display: flex;
            flex: 0 0 34px;
            align-items: center;
            gap: 2px;
            visibility: hidden;
            pointer-events: none;
        }

        .brand-wrap:hover .brand-switcher-track,
        .brand-wrap:focus-within .brand-switcher-track,
        .brand-wrap.menu-locked .brand-switcher-track {
            transform: translateY(-40px);
        }

        .brand-wrap:hover .title-wrap,
        .brand-wrap:focus-within .title-wrap,
        .brand-wrap.menu-locked .title-wrap {
            opacity: 0;
        }

        .brand-wrap:hover .brand-menu,
        .brand-wrap:focus-within .brand-menu,
        .brand-wrap.menu-locked .brand-menu {
            visibility: visible;
            pointer-events: auto;
        }

        .brand-menu-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            padding: 0 7px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: 0.74rem;
            font-weight: 700;
        }

        .brand-menu-item:hover,
        .brand-menu-item:focus-visible {
            outline: none;
            background: var(--accent-bg);
            color: var(--text);
        }

        .brand-menu-entry {
            position: relative;
        }

        .brand-menu-children {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            display: grid;
            min-width: 260px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 140ms ease, transform 140ms ease;
        }

        .brand-menu-entry.is-open .brand-menu-children {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .brand-menu-child {
            display: grid;
            grid-template-columns: 16px minmax(0, 1fr);
            align-items: center;
            column-gap: 8px;
            width: 100%;
            padding: 5px 9px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 0.89rem;
            text-align: left;
        }

        .brand-menu-separator {
            height: 1px;
            margin: 5px 4px;
            background: var(--border);
        }

        .brand-menu-child:hover,
        .brand-menu-child:focus-visible {
            outline: none;
            background: var(--accent-bg);
        }

        .svg-filler-square,
        .menu-icon,
        .header-action-icon {
            display: block;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-switcher-track {
                transition: none;
            }
        }

        .title {
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1;
        }

        .button {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 11px;
            background: var(--card-2);
            color: var(--text);
            cursor: pointer;
            font-weight: 650;
        }

        .button:hover {
            border-color: var(--accent);
        }

        .button:disabled {
            opacity: 0.55;
            cursor: default;
        }

        .button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-text);
        }

        .button.small {
            padding: 5px 8px;
            font-size: 0.75rem;
        }

        .header-action-menu {
            position: relative;
        }

        .header-action-split {
            display: flex;
            align-items: stretch;
        }

        .header-icon-button {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card-2);
            color: var(--text);
            cursor: pointer;
        }

        .header-icon-button:hover {
            border-color: var(--accent);
        }

        .header-icon-button:disabled {
            opacity: 0.55;
            cursor: default;
        }

        .header-icon-button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--accent-text);
        }

        .header-action-split .header-icon-button:first-child {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .header-action-split .header-icon-button:last-child {
            width: 22px;
            margin-left: -1px;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        .header-action-chevron {
            font-size: 0.72rem;
            line-height: 1;
        }

        .header-action-ellipsis {
            font-size: 1.2rem;
            line-height: 1;
            transform: translateY(-1px);
        }

        .header-action-menu-popover {
            position: absolute;
            top: calc(100% + 7px);
            right: 0;
            z-index: 30;
            min-width: 210px;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
            opacity: 0;
            pointer-events: none;
            transform: translateY(-4px);
            transition: opacity 140ms ease, transform 140ms ease;
        }

        .header-action-menu.is-open .header-action-menu-popover {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .header-action-menu-item {
            display: flex;
            width: 100%;
            padding: 7px 9px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
        }

        .header-action-menu-item:hover,
        .header-action-menu-item:focus-visible {
            outline: none;
            background: var(--accent-bg);
        }

        .header-action-menu-separator {
            height: 1px;
            margin: 5px 3px;
            background: var(--border);
        }

        .layout {
            flex: 1 1 auto;
            min-height: 0;
            display: grid;
            grid-template-columns:
        70px var(--explorer-width) 8px minmax(420px, 1fr) 8px var(--inspector-width);
            overflow: hidden;
        }

        .rail {
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 8px;
            border-right: 1px solid var(--border);
            background: var(--card);
        }

        .rail-group {
            display: grid;
            gap: 10px;
        }

        .rail-button {
            position: relative;
            display: grid;
            place-items: center;
            width: 52px;
            min-height: 50px;
            margin: 0 auto;
            border: 1px solid transparent;
            border-radius: 13px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .rail-button:hover {
            border-color: var(--border);
            background: var(--card-2);
            color: var(--text);
        }

        .rail-button.active {
            background: var(--accent-bg);
            color: var(--accent);
        }

        .rail-button.active::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 9px;
            bottom: 9px;
            width: 3px;
            border-radius: 999px;
            background: var(--accent);
        }

        .rail-icon {
            font-size: 1.16rem;
            font-weight: 800;
            line-height: 1;
        }

        .rail-label {
            margin-top: 4px;
            font-size: 0.61rem;
            font-weight: 700;
        }

        .rail-badge {
            position: absolute;
            right: 2px;
            top: 2px;
            display: grid;
            place-items: center;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-text);
            font-size: 0.58rem;
            font-weight: 800;
        }

        .explorer,
        .right-panel {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--card);
        }

        .explorer {
            border-right: 1px solid var(--border);
        }

        .right-panel {
            border-left: 1px solid var(--border);
        }

        .panel-resizer {
            position: relative;
            min-height: 0;
            cursor: col-resize;
            touch-action: none;
            user-select: none;
            background: transparent;
        }

        .panel-resizer::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 3px;
            width: 2px;
            background: transparent;
            transition: background 120ms ease;
        }

        .panel-resizer:hover::after,
        .panel-resizer.resizing::after {
            background: var(--accent);
        }

        .panel-head {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
        }

        .panel-title {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.045em;
        }


        .panel-body,
        .inspector {
            min-height: 0;
            overflow: auto;
            padding: 11px;
        }

        .search {
            margin-bottom: 10px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: var(--text);
            padding: 8px 9px;
        }


        textarea {
            min-height: 78px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .list {
            display: grid;
            gap: 5px;
        }

        .group-label {
            margin: 12px 4px 6px;
            color: var(--muted);
            font-size: 0.69rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.045em;
        }

        .list-item {
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            text-align: left;
            cursor: pointer;
        }

        .list-item:hover,
        .list-item.selected {
            border-color: var(--border);
            background: var(--card-2);
        }

        .item-icon {
            color: var(--muted);
            font-weight: 800;
            flex: 0 0 auto;
        }

        .item-main {
            flex: 1;
            min-width: 0;
        }

        .item-title {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .item-sub {
            display: block;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-size: 0.68rem;
        }

        .item-meta {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 0.65rem;
            text-align: right;
        }

        .vars {
            display: grid;
            gap: 4px;
            margin: 4px 0 9px 24px;
        }

        .var {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 5px 7px;
            border-radius: 8px;
            background: var(--accent-bg-subtle);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.68rem;
            cursor: pointer;
        }

        .var:hover {
            background: var(--accent-bg);
        }

        .center {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: 48px minmax(0, 1fr) 190px;
            background: var(--panel);
        }

        .canvas-head {
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 11px;
            border-bottom: 1px solid var(--border);
            font-size: 0.78rem;
        }

        .muted {
            color: var(--muted);
        }

        .canvas {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 0 0, var(--border) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            background-position: 0 0;
            cursor: default;
            touch-action: none;
        }

        .canvas.panning {
            cursor: grabbing;
        }

        .canvas-stage {
            position: relative;
            width: 1500px;
            height: 1000px;
            transform-origin: 0 0;
            will-change: transform;
        }

        #edge-layer {
            position: absolute;
            inset: 0;
            width: 1500px;
            height: 1000px;
            pointer-events: none;
            overflow: visible;
        }

        .edge {
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            opacity: 0.78;
        }

        .edge.active {
            stroke: var(--accent);
            stroke-width: 3;
            opacity: 1;
        }

        .node {
            --node-border: var(--border);
            position: absolute;
            width: 220px;
            min-width: 140px;
            height: 120px; /* 11 x 6 cells on the 20px canvas grid. */
            border-radius: 14px;
            box-sizing: border-box;
            border: 1px solid var(--node-border);
            overflow: visible;
            background: var(--card);
            box-shadow: 0 9px 26px rgba(0, 0, 0, 0.16);
            user-select: none;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .node.running {
            --node-border: #3b82f6;
        }

        .node.executing {
            --node-border: #3b82f6;
        }

        .node.success {
            --node-border: var(--success);
        }

        .node.error {
            --node-border: var(--danger);
        }

        .node.selected {
            --node-border: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.18), 0 9px 26px rgba(0, 0, 0, 0.16);
        }

        .node-head {
            position: relative;
            display: flex;
            align-items: center;
            gap: 9px;
            box-sizing: border-box;
            height: 52px;
            padding: 0 10px;
            cursor: pointer;
        }

        .node-head:active,
        .node-head.dragging {
            cursor: grabbing;
        }

        .node-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: fixel-pont, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .node-kind {
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-size: 0.66rem;
        }

        .node-icon {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 10px;
            background: var(--accent-bg);
            color: var(--accent);
        }

        .node-icon svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 1.8;
        }

        .node-copy {
            min-width: 0;
            flex: 1 1 auto;
        }

        .node-body {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .node-tag {
            display: inline-flex;
            min-width: 0;
            max-width: 132px;
            flex: 0 1 auto;
            overflow: hidden;
            align-items: center;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 4px 7px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.66rem;
            line-height: 1;
        }

        .node-tag.input {
            color: var(--text);
            background: color-mix(in srgb, var(--border) 55%, transparent);
        }

        .node-tag.output {
            color: var(--success);
            background: color-mix(in srgb, var(--success) 12%, transparent);
        }

        .node-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            height: 32px;
            padding: 0 10px 8px;
            line-height: 1;
        }

        .node-id {
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: 0.02em;
        }

        .port {
            position: absolute;
            top: 14px; /* Centre lands on the first internal 20px grid line. */
            width: 12px;
            height: 12px;
            border: 2px solid var(--card);
            border-radius: 50%;
            background: var(--node-border);
        }

        .port.in {
            left: -6px;
        }

        .port.in.alt {
            top: -6px;
            left: calc(50% - 6px);
        }

        .port.out {
            top: auto;
            right: auto;
            bottom: -6px;
            left: calc(50% - 6px);
        }

        .drawer {
            min-height: 0;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
            background: var(--card);
        }

        .tabs {
            display: flex;
            gap: 2px;
            padding: 0 8px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            flex: 0 0 auto;
        }

        .tab {
            border: 0;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: var(--muted);
            padding: 8px 9px;
            cursor: pointer;
            font-size: 0.73rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .tab.active {
            border-bottom-color: var(--accent);
            color: var(--text);
        }

        .drawer-body {
            min-height: 0;
            overflow: auto;
            padding: 9px 11px;
        }

        .log-row {
            display: grid;
            grid-template-columns: 72px 92px minmax(0, 1fr);
            gap: 8px;
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.7rem;
        }

        .log-time {
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .field {
            margin-bottom: 11px;
        }

        .field label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .section-heading {
            margin: 14px 0 8px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

                    width: 220,
                    arguments: {
                        name: "Alphasunny"

                    output: "soloLevelingSearch",
                    x: 940,
                    y: 220,
                    width: 220,
                    arguments: {
                        name: "solo leveling",
                        limit: "10",
                        sortBy: "popular"
                    },

                        audit: true,
                        timeoutMs: 30000,
                        scopes: ["HTTP_CLIENT", "EXTERNAL_API_READ"]

                ["r-001", "r-002"],

        const canvas = document.getElementById("canvas");
        const canvasStage = document.getElementById("canvas-stage");
        const edgeLayer = document.getElementById("edge-layer");
        const explorerTitle = document.getElementById("explorer-title");
        const explorerSearch = document.getElementById("explorer-search");
        const explorerContent = document.getElementById("explorer-content");
        const inspector = document.getElementById("inspector");
        const drawerBody = document.getElementById("drawer-body");
        const workflowStatus = document.getElementById("workflow-status");
        const selectedNodeLabel = document.getElementById("selected-node-label");
        const brandWrap = document.querySelector(".brand-wrap");
        const brandMenuEntries = Array.from(document.querySelectorAll(".brand-menu-entry"));
        const headerActions = document.querySelector(".actions");
        const headerActionMenus = Array.from(document.querySelectorAll("[data-header-action-menu]"));
        const runButton = document.getElementById("run-button");
        const runOptionsToggle = document.getElementById("run-options-toggle");
        const runtimeOptionsToggle = document.getElementById("runtime-options-toggle");

        function replaceIconPlaceholders() {
            if (!window.IconSets?.codeSquareSolid) return;

            document.querySelectorAll(".brand-menu .svg-filler-square").forEach(placeholder => {
                const icon = window.IconSets.codeSquareSolid({
                    size: 16,
                    className: "menu-icon",
                    asElement: true
                });
                placeholder.replaceWith(icon);
            });

            document.querySelectorAll(".action-icon-slot").forEach(placeholder => {
                const icon = window.IconSets.codeSquareSolid({
                    size: 16,
                    className: "header-action-icon",
                    asElement: true
                });
                placeholder.replaceWith(icon);
            });
        }

        replaceIconPlaceholders();
        runButton.title = `Run ${state.workflowName}`;
        runButton.setAttribute("aria-label", `Run ${state.workflowName}`);

        function closeBrandMenus() {
            brandMenuEntries.forEach(entry => entry.classList.remove("is-open"));
            brandWrap.classList.remove("menu-locked");
            if (brandWrap.contains(document.activeElement)) document.activeElement.blur();
        }

        function openBrandMenu(entry) {
            closeHeaderActionMenus();
            brandMenuEntries.forEach(candidate => candidate.classList.toggle("is-open", candidate === entry));
            brandWrap.classList.add("menu-locked");
        }

        brandMenuEntries.forEach(entry => {
            const menuButton = entry.querySelector(".brand-menu-item");
            menuButton.addEventListener("click", event => {
                event.stopPropagation();
                openBrandMenu(entry);
            });
            entry.addEventListener("mouseenter", () => openBrandMenu(entry));
            menuButton.addEventListener("focus", () => openBrandMenu(entry));
        });

        function closeHeaderActionMenus() {
            headerActionMenus.forEach(menu => {
                menu.classList.remove("is-open");
                menu.querySelector("[aria-haspopup=menu]")?.setAttribute("aria-expanded", "false");
            });
        }

        function toggleHeaderActionMenu(menu, toggle) {
            const willOpen = !menu.classList.contains("is-open");
            closeHeaderActionMenus();
            if (!willOpen) return;

            closeBrandMenus();
            menu.classList.add("is-open");
            toggle.setAttribute("aria-expanded", "true");
        }

        runOptionsToggle.addEventListener("click", event => {
            event.stopPropagation();
            toggleHeaderActionMenu(runOptionsToggle.closest("[data-header-action-menu]"), runOptionsToggle);

        function escapeHtml(value) {
            return String(value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")

        function getNode(id) {

        function renderRail() {

                            Object.keys(node.arguments).forEach(key => {

              ${runs.map(run => `

        function renderNodes() {
            canvasStage.querySelectorAll(".node").forEach(element => element.remove());

            state.nodes.forEach(node => {
                const element = document.createElement("article");
                element.className = `node${node.id === state.selectedNodeId ? " selected" : ""}`;
                element.dataset.nodeId = node.id;
                node.x = snapToGrid(node.x);
                node.y = snapToGrid(node.y);
                node.width = snapToGrid(node.width || 220);

                element.style.left = `${node.x}px`;
                element.style.top = `${node.y}px`;
                element.style.width = `${node.width}px`;

                const [primaryArgument] = Object.entries(node.arguments);
                const [argumentName, argumentValue] = primaryArgument || ["", ""];
                const argumentText = String(argumentValue);
                const compactArgument = argumentText.length > 24 ? argumentName : argumentText;
                const icon = node.kind === "trigger"
                        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg>'
                        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9l3 3-3 3m5 0h3"/></svg>';

                element.innerHTML = `
            <div class="node-head">
              <span class="port in"></span>
              <span class="port in alt"></span>
              <span class="port out"></span>
              <span class="node-icon" title="${escapeHtml(node.toolId)} / ${escapeHtml(node.functionName)}">${icon}</span>
              <div class="node-copy">
                <div class="node-title">${escapeHtml(node.title)}</div>
                <div class="node-kind">${escapeHtml(node.toolId)} / ${escapeHtml(node.functionName)}</div>
              </div>
            </div>
            <div class="node-body">
              ${primaryArgument
                        ? `<span class="node-tag input" title="${escapeHtml(argumentName)}: ${escapeHtml(argumentText)}">${escapeHtml(compactArgument)}</span>`
                        : '<span class="node-tag input muted">No input</span>'}
              <span class="node-tag output" title="Output: ${escapeHtml(node.output)}">↗ ${escapeHtml(node.output)}</span>
            </div>
            <div class="node-footer">
              <code class="node-id">${escapeHtml(node.id)}</code>
            </div>
          `;

                element.addEventListener("click", () => {
                    state.selectedNodeId = node.id;
                    renderNodes();
                    renderEdges();
                    renderInspector();
                });

                enableDragging(element, node);
                canvasStage.appendChild(element);
                constrainNodeToCanvas(node, element);
            });
        }

        function constrainNodeToCanvas(node, element) {
            const width = node.width || element.offsetWidth;
            const height = element.offsetHeight;
            const minX = CANVAS_NODE_INSET;
            const minY = CANVAS_NODE_INSET;
            const maxX = Math.max(minX, canvasStage.offsetWidth - width - CANVAS_NODE_INSET);
            const maxY = Math.max(minY, canvasStage.offsetHeight - height - CANVAS_NODE_INSET);

            node.x = Math.max(minX, Math.min(maxX, snapToGrid(node.x)));
            node.y = Math.max(minY, Math.min(maxY, snapToGrid(node.y)));
            element.style.left = `${node.x}px`;
            element.style.top = `${node.y}px`;
        }

        function checkNodeOverlap(nodeId, x, y, width, height) {
            const gap = GRID_SIZE * 2; // 40px: leave one additional grid unit between nodes
            for (const other of state.nodes) {
                if (other.id === nodeId) continue;

                const otherEl = canvasStage.querySelector(`[data-node-id="${other.id}"]`);
                const otherHeight = otherEl ? otherEl.offsetHeight : 140;
                const otherWidth = other.width || 220;

                const overlapX = (x - gap < other.x + otherWidth) && (x + width + gap > other.x);
                const overlapY = (y - gap < other.y + otherHeight) && (y + height + gap > other.y);

                if (overlapX && overlapY) {
                    return true;
                }
            }
            return false;
        }

        function enableDragging(element, node) {
            const handle = element.querySelector(".node-head");
            let dragging = false;
            let startPointerX = 0;
            let startPointerY = 0;
            let startNodeX = 0;
            let startNodeY = 0;

            handle.addEventListener("pointerdown", event => {
                event.stopPropagation();
                dragging = true;
                startPointerX = event.clientX;
                startPointerY = event.clientY;
                startNodeX = node.x;
                startNodeY = node.y;
                handle.classList.add("dragging");
                handle.setPointerCapture(event.pointerId);
            });

            handle.addEventListener("pointermove", event => {
                if (!dragging) return;

                const rawX = startNodeX + (event.clientX - startPointerX) / state.canvas.zoom;
                const rawY = startNodeY + (event.clientY - startPointerY) / state.canvas.zoom;
                const currentWidth = node.width || element.offsetWidth;
                const currentHeight = element.offsetHeight;

                const minX = CANVAS_NODE_INSET;
                const minY = CANVAS_NODE_INSET;
                const maxX = Math.max(minX, canvasStage.offsetWidth - currentWidth - CANVAS_NODE_INSET);
                const maxY = Math.max(minY, canvasStage.offsetHeight - currentHeight - CANVAS_NODE_INSET);
                const clampedX = Math.max(minX, Math.min(maxX, rawX));
                const clampedY = Math.max(minY, Math.min(maxY, rawY));

                const snappedX = snapToGrid(clampedX);
                const snappedY = snapToGrid(clampedY);

                let targetX = node.x;
                let targetY = node.y;

                if (!checkNodeOverlap(node.id, snappedX, snappedY, currentWidth, currentHeight)) {
                    targetX = snappedX;
                    targetY = snappedY;
                } else {
                    // Try sliding horizontally
                    if (!checkNodeOverlap(node.id, snappedX, node.y, currentWidth, currentHeight)) {
                        targetX = snappedX;
                    }
                    // Try sliding vertically
                    else if (!checkNodeOverlap(node.id, node.x, snappedY, currentWidth, currentHeight)) {
                        targetY = snappedY;
                    }
                }

                node.x = targetX;
                node.y = targetY;

                element.style.left = `${node.x}px`;
                element.style.top = `${node.y}px`;
                renderEdges();
            });

            const endDrag = event => {
                if (!dragging) return;
                dragging = false;
                handle.classList.remove("dragging");
                if (handle.hasPointerCapture(event.pointerId)) {
                    handle.releasePointerCapture(event.pointerId);
                }
                renderDrawer();
            };

            handle.addEventListener("pointerup", endDrag);
            handle.addEventListener("pointercancel", endDrag);
        }

        function isSegmentIntersectingBox(x1, y1, x2, y2, box, padding = 4) {
            const bLeft = box.left - padding;
            const bRight = box.right + padding;
            const bTop = box.top - padding;
            const bBottom = box.bottom + padding;

            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const minY = Math.min(y1, y2);
            const maxY = Math.max(y1, y2);

            if (maxX < bLeft || minX > bRight || maxY < bTop || minY > bBottom) {
                return false;
            }

            if (x1 === x2) {
                return x1 >= bLeft && x1 <= bRight && maxY >= bTop && minY <= bBottom;
            }
            if (y1 === y2) {
                return y1 >= bTop && y1 <= bBottom && maxX >= bLeft && minX <= bRight;
            }

            return true;
        }

        function waypointsToSvgPath(waypoints, radius = 10) {
            if (!waypoints || waypoints.length < 2) return "";
            if (waypoints.length === 2) {
                return `M ${waypoints[0].x} ${waypoints[0].y} L ${waypoints[1].x} ${waypoints[1].y}`;
            }

            let d = `M ${waypoints[0].x} ${waypoints[0].y}`;

            for (let i = 1; i < waypoints.length - 1; i++) {
                const pPrev = waypoints[i - 1];
                const pCurr = waypoints[i];
                const pNext = waypoints[i + 1];

                const d1x = Math.sign(pCurr.x - pPrev.x);
                const d1y = Math.sign(pCurr.y - pPrev.y);
                const len1 = Math.hypot(pCurr.x - pPrev.x, pCurr.y - pPrev.y);

                const d2x = Math.sign(pNext.x - pCurr.x);
                const d2y = Math.sign(pNext.y - pCurr.y);
                const len2 = Math.hypot(pNext.x - pCurr.x, pNext.y - pCurr.y);

                const r = Math.min(radius, len1 * 0.45, len2 * 0.45);

                const bX = pCurr.x - d1x * r;
                const bY = pCurr.y - d1y * r;
                const aX = pCurr.x + d2x * r;
                const aY = pCurr.y + d2y * r;

                d += ` L ${bX} ${bY} Q ${pCurr.x} ${pCurr.y}, ${aX} ${aY}`;
            }

            d += ` L ${waypoints[waypoints.length - 1].x} ${waypoints[waypoints.length - 1].y}`;
            return d;
        }

        const ROUTER_CLEARANCE = 16;
        const ROUTER_TURN_COST = 42;
        const ROUTER_CROSSING_COST = 28;

        function portNormal(portX, portY, box) {
            const distances = [
                {x: -1, y: 0, distance: Math.abs(portX - box.left)},
                {x: 1, y: 0, distance: Math.abs(box.right - portX)},
                {x: 0, y: -1, distance: Math.abs(portY - box.top)},
                {x: 0, y: 1, distance: Math.abs(box.bottom - portY)}
            ];
            return distances.reduce((closest, candidate) =>
                    candidate.distance < closest.distance ? candidate : closest
            );
        }

        function pointInBox(point, box) {
            return point.x > box.left && point.x < box.right && point.y > box.top && point.y < box.bottom;
        }

        function segmentIsClear(from, to, obstacles) {
            return !obstacles.some(box => isSegmentIntersectingBox(from.x, from.y, to.x, to.y, box, 0));
        }

        function segmentRoutingPenalty(from, to, reservedSegments) {
            let penalty = 0;
            const horizontal = from.y === to.y;

            reservedSegments.forEach(segment => {
                const reservedHorizontal = segment.from.y === segment.to.y;

                if (horizontal && reservedHorizontal && from.y === segment.from.y) {
                    const overlap = Math.min(Math.max(from.x, to.x), Math.max(segment.from.x, segment.to.x)) -
                            Math.max(Math.min(from.x, to.x), Math.min(segment.from.x, segment.to.x));
                    if (overlap > 0) penalty += ROUTER_CROSSING_COST * 2;
                } else if (!horizontal && !reservedHorizontal && from.x === segment.from.x) {
                    const overlap = Math.min(Math.max(from.y, to.y), Math.max(segment.from.y, segment.to.y)) -
                            Math.max(Math.min(from.y, to.y), Math.min(segment.from.y, segment.to.y));
                    if (overlap > 0) penalty += ROUTER_CROSSING_COST * 2;
                } else if (horizontal !== reservedHorizontal) {
                    const horizontalSegment = horizontal ? {from, to} : segment;
                    const verticalSegment = horizontal ? segment : {from, to};
                    const crosses = verticalSegment.from.x >= Math.min(horizontalSegment.from.x, horizontalSegment.to.x) &&
                            verticalSegment.from.x <= Math.max(horizontalSegment.from.x, horizontalSegment.to.x) &&
                            horizontalSegment.from.y >= Math.min(verticalSegment.from.y, verticalSegment.to.y) &&
                            horizontalSegment.from.y <= Math.max(verticalSegment.from.y, verticalSegment.to.y);
                    if (crosses) penalty += ROUTER_CROSSING_COST;
                }
            });

            return penalty;
        }

        function compactWaypoints(points) {
            const uniquePoints = points.filter((point, index) =>
                    index === 0 || point.x !== points[index - 1].x || point.y !== points[index - 1].y
            );

            return uniquePoints.filter((point, index, allPoints) => {
                if (index === 0 || index === allPoints.length - 1) return true;
                const previous = allPoints[index - 1];
                const next = allPoints[index + 1];
                return !((previous.x === point.x && point.x === next.x) || (previous.y === point.y && point.y === next.y));
            });
        }

        function gridFloor(value) {
            return Math.floor(value / GRID_SIZE) * GRID_SIZE;
        }

        function gridCeil(value) {
            return Math.ceil(value / GRID_SIZE) * GRID_SIZE;
        }

        function constrainGridCoordinate(value, maximum) {
            return Math.max(GRID_SIZE, Math.min(maximum - GRID_SIZE, snapToGrid(value)));
        }

        function portRouteAnchors(portX, portY, normal, box) {
            const width = canvasStage.offsetWidth;
            const height = canvasStage.offsetHeight;
            let outerX = portX;
            let outerY = portY;

            if (normal.x > 0) outerX = gridCeil(box.right + ROUTER_CLEARANCE);
            if (normal.x < 0) outerX = gridFloor(box.left - ROUTER_CLEARANCE);
            if (normal.y > 0) outerY = gridCeil(box.bottom + ROUTER_CLEARANCE);
            if (normal.y < 0) outerY = gridFloor(box.top - ROUTER_CLEARANCE);

            const outer = {
                x: Math.max(GRID_SIZE, Math.min(width - GRID_SIZE, outerX)),
                y: Math.max(GRID_SIZE, Math.min(height - GRID_SIZE, outerY))
            };
            const grid = normal.x
                    ? {x: outer.x, y: constrainGridCoordinate(portY, height)}
                    : {x: constrainGridCoordinate(portX, width), y: outer.y};

            return {outer, grid};
        }

        function findGridRoute(start, end, obstacles, reservedSegments) {
            const width = canvasStage.offsetWidth;
            const height = canvasStage.offsetHeight;
            const xCoords = new Set([GRID_SIZE, width - GRID_SIZE, start.x, end.x]);
            const yCoords = new Set([GRID_SIZE, height - GRID_SIZE, start.y, end.y]);

            obstacles.forEach(box => {
                xCoords.add(Math.max(GRID_SIZE, gridFloor(box.left - 1)));
                xCoords.add(Math.min(width - GRID_SIZE, gridCeil(box.right + 1)));
                yCoords.add(Math.max(GRID_SIZE, gridFloor(box.top - 1)));
                yCoords.add(Math.min(height - GRID_SIZE, gridCeil(box.bottom + 1)));
            });

            const xs = [...xCoords].sort((a, b) => a - b);
            const ys = [...yCoords].sort((a, b) => a - b);
            const points = [];
            const pointIndexByCoordinate = new Map();

            ys.forEach(y => {
                xs.forEach(x => {
                    const point = {x, y};
                    if (!obstacles.some(box => pointInBox(point, box))) {
                        const key = `${x},${y}`;
                        pointIndexByCoordinate.set(key, points.length);
                        points.push(point);
                    }
                });
            });

            const startIndex = pointIndexByCoordinate.get(`${start.x},${start.y}`);
            const endIndex = pointIndexByCoordinate.get(`${end.x},${end.y}`);
            if (startIndex === undefined || endIndex === undefined) return null;

            const neighbors = Array.from({length: points.length}, () => []);
            const pointAt = (x, y) => pointIndexByCoordinate.get(`${x},${y}`);

            ys.forEach(y => {
                for (let index = 0; index < xs.length - 1; index++) {
                    const fromIndex = pointAt(xs[index], y);
                    const toIndex = pointAt(xs[index + 1], y);
                    if (fromIndex === undefined || toIndex === undefined) continue;
                    const from = points[fromIndex];
                    const to = points[toIndex];
                    if (!segmentIsClear(from, to, obstacles)) continue;
                    neighbors[fromIndex].push({index: toIndex, direction: "horizontal"});
                    neighbors[toIndex].push({index: fromIndex, direction: "horizontal"});
                }
            });

            xs.forEach(x => {
                for (let index = 0; index < ys.length - 1; index++) {
                    const fromIndex = pointAt(x, ys[index]);
                    const toIndex = pointAt(x, ys[index + 1]);
                    if (fromIndex === undefined || toIndex === undefined) continue;
                    const from = points[fromIndex];
                    const to = points[toIndex];
                    if (!segmentIsClear(from, to, obstacles)) continue;
                    neighbors[fromIndex].push({index: toIndex, direction: "vertical"});
                    neighbors[toIndex].push({index: fromIndex, direction: "vertical"});
                }
            });

            const startKey = `${startIndex}:start`;
            const pending = [{key: startKey, index: startIndex, direction: "start", score: 0}];
            const bestScore = new Map([[startKey, 0]]);
            const previous = new Map();

            while (pending.length) {
                pending.sort((a, b) => a.score - b.score);
                const current = pending.shift();
                if (current.score !== bestScore.get(current.key)) continue;

                if (current.index === endIndex) {
                    const route = [];
                    let key = current.key;
                    while (key) {
                        const [pointIndex] = key.split(":");
                        route.unshift(points[Number(pointIndex)]);
                        key = previous.get(key);
                    }
                    return route;
                }

                neighbors[current.index].forEach(next => {
                    const from = points[current.index];
                    const to = points[next.index];
                    const distance = Math.abs(to.x - from.x) + Math.abs(to.y - from.y);
                    const turnCost = current.direction !== "start" && current.direction !== next.direction ? ROUTER_TURN_COST : 0;
                    const score = current.score + distance + turnCost + segmentRoutingPenalty(from, to, reservedSegments);
                    const key = `${next.index}:${next.direction}`;

                    if (score >= (bestScore.get(key) ?? Infinity)) return;
                    bestScore.set(key, score);
                    previous.set(key, current.key);
                    pending.push({key, index: next.index, direction: next.direction, score});
                });
            }

            return null;
        }

        function computeOrthogonalPath(sourceX, sourceY, targetX, targetY, sourceBox, targetBox, obstacleBoxes, reservedSegments) {
            const sourceNormal = portNormal(sourceX, sourceY, sourceBox);
            const targetNormal = portNormal(targetX, targetY, targetBox);
            const sourceAnchors = portRouteAnchors(sourceX, sourceY, sourceNormal, sourceBox);
            const targetAnchors = portRouteAnchors(targetX, targetY, targetNormal, targetBox);
            const paddedObstacles = obstacleBoxes.map(box => ({
                ...box,
                left: Math.max(0, box.left - ROUTER_CLEARANCE),
                top: Math.max(0, box.top - ROUTER_CLEARANCE),
                right: Math.min(canvasStage.offsetWidth, box.right + ROUTER_CLEARANCE),
                bottom: Math.min(canvasStage.offsetHeight, box.bottom + ROUTER_CLEARANCE)
            }));
            const gridRoute = findGridRoute(sourceAnchors.grid, targetAnchors.grid, paddedObstacles, reservedSegments);

            if (!gridRoute) return null;

            return compactWaypoints([
                {x: sourceX, y: sourceY},
                sourceAnchors.outer,
                ...gridRoute,
                targetAnchors.outer,
                {x: targetX, y: targetY}
            ]);
        }

        function renderEdges(activeTargetId = null) {
            edgeLayer.innerHTML = "";

            const obstacleBoxes = Array.from(canvasStage.querySelectorAll(".node")).map(el => ({
                id: el.getAttribute("data-node-id") || el.dataset.nodeId,
                left: el.offsetLeft,
                top: el.offsetTop,
                right: el.offsetLeft + el.offsetWidth,
                bottom: el.offsetTop + el.offsetHeight
            }));

            const edgeLayouts = state.edges.map(([sourceId, targetId]) => {
                const source = canvasStage.querySelector(`[data-node-id="${sourceId}"]`);
                const target = canvasStage.querySelector(`[data-node-id="${targetId}"]`);
                if (!source || !target) return null;

                const sourcePort = source.querySelector(".port.out");
                const targetPorts = Array.from(target.querySelectorAll(".port.in"));
                if (!sourcePort || !targetPorts.length) return null;

                const portCenter = (node, port) => {
                    const portLeft = port.offsetLeft + (port.offsetParent ? port.offsetParent.offsetLeft : 0);
                    const portTop = port.offsetTop + (port.offsetParent ? port.offsetParent.offsetTop : 0);
                    return {
                        x: node.offsetLeft + portLeft + port.offsetWidth / 2,
                        y: node.offsetTop + portTop + port.offsetHeight / 2
                    };
                };

                const sourcePoint = portCenter(source, sourcePort);

                return {
                    sourceId,
                    targetId,
                    sourceX: sourcePoint.x,
                    sourceY: sourcePoint.y,
                    targetPoints: targetPorts.map(portCenter.bind(null, target)),
                    sourceNode: getNode(sourceId),
                    targetNode: getNode(targetId)
                };
            }).filter(Boolean);

            const reservedSegments = [];
            edgeLayouts.forEach(edge => {
                const sourceBox = obstacleBoxes.find(box => box.id === edge.sourceId);
                const targetBox = obstacleBoxes.find(box => box.id === edge.targetId);
                if (!sourceBox || !targetBox) return;

                const routes = edge.targetPoints.map(targetPoint => {
                    const waypoints = computeOrthogonalPath(
                            edge.sourceX,
                            edge.sourceY,
                            targetPoint.x,
                            targetPoint.y,
                            sourceBox,
                            targetBox,
                            obstacleBoxes,
                            reservedSegments
                    );
                    if (!waypoints || waypoints.length < 2) return null;

                    const distance = waypoints.slice(1).reduce((total, point, index) => {
                        const previous = waypoints[index];
                        return total + Math.abs(point.x - previous.x) + Math.abs(point.y - previous.y);
                    }, 0);
                    return {waypoints, distance};
                }).filter(Boolean);
                if (!routes.length) return;

                // Left input stays the tie-breaker; the top input is used only when its routed path is shorter.
                const {waypoints} = routes.reduce((shortest, route) =>
                        route.distance < shortest.distance ? route : shortest
                );

                for (let index = 1; index < waypoints.length; index++) {
                    reservedSegments.push({from: waypoints[index - 1], to: waypoints[index]});
                }

                const svgPathString = waypointsToSvgPath(waypoints, 10);
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", svgPathString);
                path.setAttribute("class", `edge${activeTargetId === edge.targetId ? " active" : ""}`);
                edgeLayer.appendChild(path);
            });
        }

        function applyCanvasTransform() {
            const {x, y, zoom} = state.canvas;
            canvasStage.style.transform = `translate(${x}px, ${y}px) scale(${zoom})`;
            canvas.style.backgroundSize = `${20 * zoom}px ${20 * zoom}px`;
            canvas.style.backgroundPosition = `${x}px ${y}px`;
        }

        function initializeCanvasNavigation() {
            let panning = false;
            let startX = 0;
            let startY = 0;
            let originX = 0;
            let originY = 0;

            canvas.addEventListener("pointerdown", event => {
                if (event.button !== 0 || event.target.closest(".node")) return;

                panning = true;
                startX = event.clientX;
                startY = event.clientY;
                originX = state.canvas.x;
                originY = state.canvas.y;
                canvas.classList.add("panning");
                canvas.setPointerCapture(event.pointerId);
                event.preventDefault();
            });

            canvas.addEventListener("pointermove", event => {
                if (!panning) return;

                state.canvas.x = originX + event.clientX - startX;
                state.canvas.y = originY + event.clientY - startY;
                applyCanvasTransform();
            });

            const endPan = event => {
                if (!panning) return;
                panning = false;
                canvas.classList.remove("panning");
                if (canvas.hasPointerCapture(event.pointerId)) {
                    canvas.releasePointerCapture(event.pointerId);
                }
            };

            canvas.addEventListener("pointerup", endPan);
            canvas.addEventListener("pointercancel", endPan);

            canvas.addEventListener("wheel", event => {
                event.preventDefault();

                const bounds = canvas.getBoundingClientRect();
                const pointerX = event.clientX - bounds.left;
                const pointerY = event.clientY - bounds.top;
                const {x, y, zoom} = state.canvas;
                const worldX = (pointerX - x) / zoom;
                const worldY = (pointerY - y) / zoom;
                const nextZoom = Math.max(0.35, Math.min(1.9, zoom * (event.deltaY < 0 ? 1.1 : 0.9)));

                state.canvas.zoom = nextZoom;
                state.canvas.x = pointerX - worldX * nextZoom;
                state.canvas.y = pointerY - worldY * nextZoom;
                applyCanvasTransform();
            }, {passive: false});
        }

        function initializePanelResizers() {
            const bounds = {
                explorer: {min: 190, max: 460, variable: "--explorer-width"},
                inspector: {min: 260, max: 520, variable: "--inspector-width"}
            };

            document.querySelectorAll("[data-resize-panel]").forEach(resizer => {
                const panelName = resizer.dataset.resizePanel;
                const settings = bounds[panelName];
                let resizing = false;
                let startX = 0;
                let startWidth = 0;

                resizer.addEventListener("pointerdown", event => {
                    resizing = true;
                    startX = event.clientX;
                    startWidth = document.documentElement.style.getPropertyValue(settings.variable)
                            ? Number.parseFloat(document.documentElement.style.getPropertyValue(settings.variable))
                            : document.querySelector(panelName === "explorer" ? ".explorer" : ".right-panel").getBoundingClientRect().width;
                    resizer.classList.add("resizing");
                    resizer.setPointerCapture(event.pointerId);
                    event.preventDefault();
                });

                resizer.addEventListener("pointermove", event => {
                    if (!resizing) return;

                    const direction = panelName === "explorer" ? 1 : -1;
                    const nextWidth = Math.max(
                            settings.min,
                            Math.min(settings.max, startWidth + direction * (event.clientX - startX))
                    );
                    document.documentElement.style.setProperty(settings.variable, `${nextWidth}px`);
                });

                const endResize = event => {
                    if (!resizing) return;
                    resizing = false;
                    resizer.classList.remove("resizing");
                    if (resizer.hasPointerCapture(event.pointerId)) {
                        resizer.releasePointerCapture(event.pointerId);
                    }
                };

                resizer.addEventListener("pointerup", endResize);
                resizer.addEventListener("pointercancel", endResize);
            });
        }

        function nodeDefinition(node) {
            return {
                id: node.id,
                kind: node.kind,
                toolId: node.toolId,
                function: node.functionName,
                arguments: node.arguments,
                output: {
                    variable: node.output,
                    source: "structuredContent"
                },
                annotations: node.annotations
            };
        }

        function workflowDefinition() {
            return {
                id: "desktop-volume-greeting-solo-leveling",
                version: 1,
                nodes: state.nodes.map(nodeDefinition),
                edges: state.edges.map(([source, target], index) => ({
                    id: `edge-${index + 1}`,
                    kind: "control",
                    source,
                    sourcePort: "success",
                    target,
                    targetPort: "trigger"
                }))
            };
        }

        function renderInspector() {
            const selectedNode = getNode(state.selectedNodeId);
            selectedNodeLabel.textContent = selectedNode.title;

            document.querySelectorAll("[data-inspector]").forEach(button => {
                button.classList.toggle("active", button.dataset.inspector === state.inspector);
            });

            if (state.inspector === "node") {
                const argumentsHtml = Object.keys(selectedNode.arguments)
                        .map(key => `
              <div class="box">
                <div class="muted" style="font-size:.68rem;margin-bottom:5px">
                  ${escapeHtml(key)}
                </div>
                <textarea data-argument="${escapeHtml(key)}">${escapeHtml(selectedNode.arguments[key])}</textarea>
              </div>
            `)
                        .join("") || empty("No input arguments.");

                inspector.innerHTML = `
            <div class="field">
              <label for="node-title-input">Display name</label>
              <input id="node-title-input" value="${escapeHtml(selectedNode.title)}">
            </div>

            <div class="field">
              <label for="node-tool-input">Tool ID</label>
              <input id="node-tool-input" value="${escapeHtml(selectedNode.toolId)}">
            </div>

            <div class="field">
              <label for="node-function-input">Function</label>
              <input id="node-function-input" value="${escapeHtml(selectedNode.functionName)}">
            </div>

            <div class="field">
              <label for="node-output-input">Output variable</label>
              <input id="node-output-input" value="${escapeHtml(selectedNode.output)}">
            </div>

            <div class="section-heading">Arguments in</div>
            ${argumentsHtml}
          `;

                [
                    ["node-title-input", "title"],
                    ["node-tool-input", "toolId"],
                    ["node-function-input", "functionName"],
                    ["node-output-input", "output"]
                ].forEach(([id, property]) => {
                    document.getElementById(id).addEventListener("input", event => {
                        selectedNode[property] = event.target.value;
                        renderNodes();
                        renderEdges();
                        selectedNodeLabel.textContent = selectedNode.title;
                        renderDrawer();

                        if (state.view === "used") {
                            renderExplorer();
                        }
                    });
                });

                inspector.querySelectorAll("[data-argument]").forEach(input => {
                    input.addEventListener("input", event => {
                        selectedNode.arguments[event.target.dataset.argument] = event.target.value;
                        renderNodes();
                        renderEdges();
                        renderDrawer();
                    });
                });

                return;
            }

            if (state.inspector === "workflow") {
                inspector.innerHTML = `
            <div class="box">
              <pre>${escapeHtml(JSON.stringify(workflowDefinition(), null, 2))}</pre>
            </div>
          `;
                return;
            }

            if (state.inspector === "annotations") {
                inspector.innerHTML = `
            <div class="section-heading" style="margin-top:0">Node annotations</div>
            <div class="box">
              <pre>${escapeHtml(JSON.stringify(selectedNode.annotations, null, 2))}</pre>
            </div>
          `;
                return;
            }

            inspector.innerHTML = `
          <div class="section-heading" style="margin-top:0">Node payload</div>
          <div class="box">
            <pre>${escapeHtml(JSON.stringify(selectedNode.arguments, null, 2))}</pre>
          </div>
        `;
        }

        function renderDrawer() {
            document.querySelectorAll("[data-drawer]").forEach(button => {
                button.classList.toggle("active", button.dataset.drawer === state.drawer);
            });

            if (state.drawer === "current") {
                drawerBody.innerHTML = state.logs.length
                        ? state.logs.map(log => `
                <div class="log-row">
                  <span class="log-time">${escapeHtml(log.time)}</span>
                  <strong>${escapeHtml(log.source)}</strong>
                  <span>${escapeHtml(log.message)}</span>
                </div>
              `).join("")
                        : empty("No current execution. Run the workflow to populate live logs.");
                return;
            }

            if (state.drawer === "variables") {
                if (state.lastRun) {
                    const entries = Object.entries(state.lastRun.results || {});
                    return drawerBody.innerHTML = entries.length
                            ? entries.map(([name, value]) => `
                <div class="box">
                  <div class="section-heading" style="margin-top:0">${escapeHtml(name)}</div>
                  <pre>${escapeHtml(JSON.stringify(value, null, 2))}</pre>
                </div>
              `).join("")
                            : empty("This run produced no named results.");
                }
                drawerBody.innerHTML = state.nodes.map(node => `
            <div class="log-row">
              <span class="log-time">object</span>
              <strong>${escapeHtml(node.output)}</strong>
              <span>${escapeHtml(node.title)} structured output</span>
            </div>
          `).join("");
                return;
            }

            drawerBody.innerHTML = `
          <pre>${escapeHtml(JSON.stringify(workflowDefinition(), null, 2))}</pre>
        `;
        }

        function addLog(source, message) {
            const time = new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });

            state.logs.unshift({time, source, message});
            renderDrawer();

            if (state.view === "current") {
                renderExplorer();
            }
        }

        function validateWorkflow() {
            const seenVariables = new Set();
            const errors = [];
            const variablePattern = /^[A-Za-z_$][A-Za-z0-9_$]*$/;

            state.nodes.forEach(node => {
                if (!variablePattern.test(node.output)) {
                    errors.push(`${node.title}: invalid output variable`);
                }

                if (seenVariables.has(node.output)) {
                    errors.push(`${node.title}: duplicate output variable`);
                }

                seenVariables.add(node.output);
            });

            if (errors.length) {
                workflowStatus.textContent = `${errors.length} validation issue(s)`;
                workflowStatus.className = "status-error";
                addLog("Validator", errors[0]);
                return false;
            }

            workflowStatus.textContent = "Workflow is valid";
            workflowStatus.className = "status-success";
            addLog("Validator", "Workflow passed validation.");
            return true;
        }

        function saveDraft() {
            workflowStatus.textContent = "Draft saved";
            workflowStatus.className = "status-success";
            addLog("Editor", "Workflow draft saved.");
        }

        async function runWorkflow() {
            if (runButton.disabled || !validateWorkflow()) return;

            state.logs = [];
            state.lastRun = null;
            state.drawer = "current";
            renderDrawer();
            runButton.disabled = true;

            state.nodes.forEach(node => {
                canvasStage.querySelector(`[data-node-id="${node.id}"]`)?.classList.remove("running", "success", "error");
            });
            state.nodes.forEach(node => {
                canvasStage.querySelector(`[data-node-id="${node.id}"]`)?.classList.add("running");
            });

            try {
                addLog("Runtime", "Submitting the desktop workflow to Meshingress.");
                const response = await fetch(WORKFLOW_SAMPLE_RUN_URL, {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        "Mcp-Session-Id": crypto.randomUUID(),
                        "X-Request-Id": crypto.randomUUID()
                    }
                });
                const run = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(run.failureMessage || `Meshingress returned HTTP ${response.status}`);
                }

                state.lastRun = run;
                addLog("Runtime", `Received ${run.status || "UNKNOWN"} result ${run.runId || ""}.`);
                (run.nodeOutcomes || []).forEach(outcome => {
                    const node = getNode(outcome.requestId);
                    const element = canvasStage.querySelector(`[data-node-id="${outcome.requestId}"]`);
                    element?.classList.remove("running");
                    element?.classList.add(outcome.failed ? "error" : "success");
                    addLog(node?.title || outcome.requestId, outcome.failed
                            ? `Failed after ${outcome.attempts} attempt(s): ${outcome.message || "unknown error"}`
                            : `Completed through ${outcome.port} on attempt ${outcome.attempts}.`);
                });

                const completed = run.status === "COMPLETED";
                workflowStatus.textContent = completed ? "Last run succeeded — outputs shown below" : "Last run failed — outputs shown below";
                workflowStatus.className = completed ? "status-success" : "status-error";
                state.drawer = "variables";
                renderDrawer();
            } catch (error) {
                state.nodes.forEach(node => {
                    const element = canvasStage.querySelector(`[data-node-id="${node.id}"]`);
                    element?.classList.remove("running");
                    element?.classList.add("error");
                });
                workflowStatus.textContent = `Run failed: ${error.message}`;
                workflowStatus.className = "status-error";
                addLog("Runtime", error.message);
            } finally {
                renderEdges();
                runButton.disabled = false;
            }
        }

        document.querySelectorAll("[data-view]").forEach(button => {
            button.addEventListener("click", () => {
                state.view = button.dataset.view;
                renderRail();
                renderExplorer();
            });
        });

        document.querySelectorAll("[data-inspector]").forEach(button => {
            button.addEventListener("click", () => {
                state.inspector = button.dataset.inspector;
                renderInspector();
            });
        });

        document.querySelectorAll("[data-drawer]").forEach(button => {
            button.addEventListener("click", () => {
                state.drawer = button.dataset.drawer;
                renderDrawer();
            });
        });

        explorerSearch.addEventListener("input", renderExplorer);
        runButton.addEventListener("click", runWorkflow);
        document.querySelector('[data-command="save-draft"]').addEventListener("click", () => {
            saveDraft();
            closeBrandMenus();
        });

        document.querySelectorAll("[data-header-command]").forEach(button => {
            button.addEventListener("click", event => {
                event.stopPropagation();
                const command = button.dataset.headerCommand;
                closeHeaderActionMenus();

                if (command === "validate") {
                    validateWorkflow();
                    return;
                }

                if (command === "run-from-trigger") {
                    runWorkflow();
                    return;
                }

                if (command === "history") {
                    state.view = "history";
                    renderRail();
                    renderExplorer();
                    return;
                }

                const messages = {
                    debug: "Debug run options are ready to configure.",
                    "edit-configurations": "Runtime configurations are ready to edit.",
                    "environment-variables": "Runtime environment variables are ready to configure.",
                    "runtime-defaults": "Runtime defaults are ready to configure.",
                    permissions: "Runtime permissions and scopes are ready to configure.",
                    "runtime-details": "Runtime details are ready to inspect."
                };
                const message = messages[command];
                if (message) {
                    workflowStatus.textContent = message;
                    workflowStatus.className = "status-success";
                    addLog("Runtime", message);
                }
            });
        });

        renderRail();
        renderExplorer();
        renderNodes();
        renderEdges();
        renderInspector();
        renderDrawer();
        state.canvas = {x: 36, y: 24, zoom: 0.86};
        applyCanvasTransform();
        initializeCanvasNavigation();
        initializePanelResizers();
    })();
</script>
</body>
