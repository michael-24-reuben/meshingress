<div class="settings-grid">
  <label class="field-group">
    <span>MCP endpoint URL</span>
    <input name="endpointUrl" type="url" required>
  </label>

  <label class="field-group">
    <span>Tool refresh interval, milliseconds</span>
    <input name="refreshIntervalMs" type="number" min="5000" step="1000" required>
  </label>

  <label class="field-group">
    <span>Bearer token, memory only</span>
    <input name="bearerToken" type="password" autocomplete="off" placeholder="Optional">
    <small>Authentication is not persisted by this MVP client.</small>
  </label>

  <label class="field-group">
    <span>MCP session ID, memory only</span>
    <input name="sessionId" type="text" autocomplete="off" placeholder="Optional">
  </label>
</div>
