      x-accepts:
      - application/json
    post:
      description: "Accepts JSON-RPC 2.0 single requests, notifications, and batches\
        \ for the Meshingress MCP transport."
      operationId: post
      parameters:
      - description: Bearer admin token for role-gated MCP methods.
        example: Bearer dev-admin
        explode: false
        in: header
        name: Authorization
        required: false
        schema:
          type: string
        style: simple
      - description: MCP role hint. Use admin for role-gated registry methods.
        example: admin
        explode: false
        in: header
        name: X-Mcp-Role
        required: false
        schema:
          type: string
        style: simple
      - description: Legacy admin flag accepted for compatibility.
        example: true
        explode: false
        in: header
        name: X-Mcp-Admin
        required: false
        schema:
          type: string
        style: simple
      - description: Client MCP session identifier.
        example: session-123
        explode: false
        in: header
        name: Mcp-Session-Id
        required: false
        schema:
          type: string
        style: simple
      - description: Caller request correlation identifier.
        example: req-123
        explode: false
        in: header
        name: X-Request-Id
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              tools/list:
                description: tools/list
                summary: List public tools
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/list
                  params: {}
              tools/call:
                description: tools/call
                summary: Invoke a tool
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: helloworld.greet
                    arguments:
                      name: Meshingress
              roles/tools/register:
                description: roles/tools/register
                summary: Register a phase-aware local JAR tool
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: roles/tools/register
                  params:
                    phase: install
                    toolId: sample.local
                    localJar:
                      path: C:/tools/sample.jar
                      checksumSha256: <sha256>
                    replace: false
              batch:
                description: batch
                summary: Batch request
                value:
                - jsonrpc: "2.0"
                  id: 4
                  method: ping
                - jsonrpc: "2.0"
                  id: 5
                  method: tools/list
                  params: {}
            schema:
              $ref: "#/components/schemas/post_request"
        description: "JSON-RPC 2.0 payload. Use a single request object for ordinary\
          \ calls, omit id for notifications, or send an array of request objects\
          \ for batches."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: JSON-RPC response object or response batch. JSON-RPC method
            failures are represented in the response body error object.
        "204":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: Notification-only request or batch produced no JSON-RPC response.
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
          description: Unsupported media type.
      summary: Dispatch MCP JSON-RPC requests
      tags:
      - mcp-controller
      x-content-type: application/json
      x-accepts:
      - application/json
