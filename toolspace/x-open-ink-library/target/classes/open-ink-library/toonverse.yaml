id: toonverse
displayName: Toonverse
apiBaseUrl: https://api.toonverse.net
metadataPath: /api/series/slug/{slug}
metadataSelector: $.data
nameSearchPath: /api/series/search
nameSearchSelector: $.data
searchPath: /api/series
searchSelector: $.data
readingChapterPath: /api/reading/chapter/{slug}/{chapterNumber}
readingChapterSelector: $.data
chaptersPath: /api/series/{seriesId}/chapters
chaptersSelector: $.data.chapters
timeoutMs: 20000
authMode: none
defaultSearchLimit: 20
maximumSearchLimit: 100
defaultChapterLimit: 50
maximumChapterLimit: 500
defaultChapterOrder: asc
