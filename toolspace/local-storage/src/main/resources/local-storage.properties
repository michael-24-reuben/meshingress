meshingress.toolspace.local-storage.enabled=true
meshingress.toolspace.local-storage.lifecycle=local-local
meshingress.toolspace.local-storage.max-entry-size=256MB
meshingress.toolspace.local-storage.local.root=${meshingress.cache.location:.cache/meshingress}/storage
meshingress.toolspace.local-storage.local.max-entries=1024
meshingress.toolspace.local-storage.local.staging.max-bytes=256MB
meshingress.toolspace.local-storage.local.staging.ttl=15m
meshingress.toolspace.local-storage.local.published.max-bytes=1GB
meshingress.toolspace.local-storage.local.published.default-ttl=30m
meshingress.toolspace.local-storage.local.published.max-ttl=24h
meshingress.toolspace.local-storage.local.published.default-max-requests=1
meshingress.toolspace.local-storage.local.published.max-requests=50
meshingress.toolspace.local-storage.local.published.max-concurrent-retrievals=32
meshingress.toolspace.local-storage.local.cleanup.interval=5m
meshingress.toolspace.local-storage.local.cleanup.batch-size=100
meshingress.toolspace.local-storage.metadata.sql.schema=meshingress
meshingress.toolspace.local-storage.metadata.sql.table-prefix=storage_
meshingress.toolspace.local-storage.metadata.sql.table.entries=storage_entries
meshingress.toolspace.local-storage.metadata.sql.table.usage=storage_usage
meshingress.toolspace.local-storage.metadata.sql.table.events=storage_events
meshingress.toolspace.local-storage.metadata.sql.initialize-schema=true
meshingress.toolspace.local-storage.external.default-target=
meshingress.toolspace.local-storage.external.access-mode=write-only
meshingress.toolspace.local-storage.external.mutation-policy=create-only
meshingress.toolspace.local-storage.external.conflict-policy=fail
meshingress.toolspace.local-storage.external.retention-policy=provider-managed
meshingress.toolspace.local-storage.external.max-concurrent-uploads=8
meshingress.toolspace.local-storage.external.upload-timeout=30m
meshingress.toolspace.local-storage.external.async-handoff.worker-interval=5s
meshingress.toolspace.local-storage.external.async-handoff.lease-duration=35m
meshingress.toolspace.local-storage.external.async-handoff.max-attempts=8
meshingress.toolspace.local-storage.external.async-handoff.initial-retry-delay=5s
meshingress.toolspace.local-storage.external.async-handoff.max-retry-delay=5m
