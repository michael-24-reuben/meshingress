paths:
  /mcp:
    post:
      tags:
      - mcp-controller
      summary: Dispatch annotated MCP JSON-RPC requests
      description: JSON-RPC 2.0 requests routed through methods discovered by @McpDispatchMapping and @McpDispatchMethod.
      operationId: postDispatchAnnotatedMethods
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer dev-admin
      - name: X-Mcp-Role
        in: header
        required: false
        schema:
          type: string
        example: admin
      - name: X-Mcp-Admin
        in: header
        required: false
        schema:
          type: string
        example: 'true'
      - name: Mcp-Session-Id
        in: header
        required: false
        schema:
          type: string
        example: session-123
      - name: X-Request-Id
        in: header
        required: false
        schema:
          type: string
        example: req-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/McpInitializeRequest'
              - $ref: '#/components/schemas/McpNotificationsInitializedRequest'
              - $ref: '#/components/schemas/McpPingRequest'
              - $ref: '#/components/schemas/McpRolesSecurityCredentialBindingsGetRequest'
              - $ref: '#/components/schemas/McpRolesSecurityCredentialBindingsListRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesActivateRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesCreateRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesCredentialsBindRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesCredentialsReplaceRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesCredentialsRevokeRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesCredentialsUnbindRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesDisableRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesGetRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesIdentitiesLinkRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesIdentitiesUnlinkRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesLimitsGetRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesLimitsUpdateRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesListRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesRevokeRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesUpdateRequest'
              - $ref: '#/components/schemas/McpRolesSecurityProfilesUsageListRequest'
              - $ref: '#/components/schemas/McpRolesSecurityToolPoliciesCreateRequest'
              - $ref: '#/components/schemas/McpRolesSecurityToolPoliciesDeleteRequest'
              - $ref: '#/components/schemas/McpRolesSecurityToolPoliciesEvaluateRequest'
              - $ref: '#/components/schemas/McpRolesSecurityToolPoliciesGetRequest'
              - $ref: '#/components/schemas/McpRolesSecurityToolPoliciesListRequest'
              - $ref: '#/components/schemas/McpRolesSecurityToolPoliciesUpdateRequest'
              - $ref: '#/components/schemas/McpRolesToolsAliasRequest'
              - $ref: '#/components/schemas/McpRolesToolsCheckRequest'
              - $ref: '#/components/schemas/McpRolesToolsContributionsListRequest'
              - $ref: '#/components/schemas/McpRolesToolsContributionsUpdateRequest'
              - $ref: '#/components/schemas/McpRolesToolsDeleteRequest'
              - $ref: '#/components/schemas/McpRolesToolsInstallPublicationRequest'
              - $ref: '#/components/schemas/McpRolesToolsListRequest'
              - $ref: '#/components/schemas/McpRolesToolsRegisterRequest'
              - $ref: '#/components/schemas/McpRolesToolsReloadRequest'
              - $ref: '#/components/schemas/McpRolesToolsUpdateRequest'
              - $ref: '#/components/schemas/McpSecurityWhoamiRequest'
              - $ref: '#/components/schemas/McpStoragePublicationStatusRequest'
              - $ref: '#/components/schemas/McpToolsCallRequest'
              - $ref: '#/components/schemas/McpToolsListRequest'
      responses:
        '200':
          description: JSON-RPC response object or response batch.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '204':
          description: Notification-only request produced no response body.
components:
