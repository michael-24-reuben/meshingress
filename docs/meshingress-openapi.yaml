openapi: "3.1.0"
info:
  title: "meshingress API"
  description: "meshingress API"
  version: "1.0.0"
servers:
  - url: "https://meshingress"
paths:
  /mcp:
    post:
      summary: "Dispatch MCP JSON-RPC requests"
      description: "Accepts JSON-RPC 2.0 single requests, notifications, and batches\
        \ for the Meshingress MCP transport."
      operationId: ""
      parameters:
        - name: "Authorization"
          in: "header"
          required: false
          description: "Bearer admin token for role-gated MCP methods."
          schema:
            type: "string"
        - name: "X-Mcp-Role"
          in: "header"
          required: false
          description: "MCP role hint. Use admin for role-gated registry methods."
          schema:
            type: "string"
        - name: "X-Mcp-Admin"
          in: "header"
          required: false
          description: "Legacy admin flag accepted for compatibility."
          schema:
            type: "string"
        - name: "Mcp-Session-Id"
          in: "header"
          required: false
          description: "Client MCP session identifier."
          schema:
            type: "string"
        - name: "X-Request-Id"
          in: "header"
          required: false
          description: "Caller request correlation identifier."
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "string"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
    delete:
      summary: "DELETE mcp"
      operationId: "delete"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
    get:
      summary: "GET mcp"
      operationId: "get"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /artifact/{groupId}/{artifactId}/{version}:
    post:
      summary: "POST artifact/{groupId}/{artifactId}/{version}"
      operationId: "upload"
      parameters:
        - name: "groupId"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "artifactId"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "version"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "type"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "TOOL_MODULE"
              - "GENERATED_TOOL_MODULE"
              - "CLI_HARNESS"
              - "AVAILABILITY_ANNOTATION"
              - "AVAILABILITY_POLICY"
              - "SCOPE_POLICY"
              - "SECURITY_POLICY"
              - "JSON_SCHEMA"
              - "SBOM"
              - "ATTESTATION"
              - "TEMPLATE"
              - "RUNTIME_PLUGIN"
            default: "GENERATED_TOOL_MODULE"
        - name: "packaging"
          in: "query"
          required: false
          schema:
            type: "string"
            default: "jar"
        - name: "requestedScopes"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
        - name: "Authorization"
          in: "header"
          required: false
          schema:
            type: "string"
        - name: "X-Repository-Role"
          in: "header"
          required: false
          schema:
            type: "string"
        - name: "X-Repository-Actor"
          in: "header"
          required: false
          schema:
            type: "string"
        - name: "X-Request-Id"
          in: "header"
          required: false
          schema:
            type: "string"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "file"
              properties:
                file:
                  type: "string"
                  format: "binary"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ArtifactRecord"
