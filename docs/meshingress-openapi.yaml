components:
  schemas:
    JsonNode:
      type: "object"
      properties: { }
    Void:
      type: "object"
      properties: { }
    ArtifactCoordinate:
      type: "object"
      properties:
        groupId:
          type: "string"
          nullable: true
        artifactId:
          type: "string"
          nullable: true
        version:
          type: "string"
          nullable: true
        classifier:
          type: "string"
          nullable: true
        packaging:
          type: "string"
          nullable: true
    ArtifactChecksum:
      type: "object"
      properties:
        algorithm:
          type: "string"
          nullable: true
        value:
          type: "string"
          nullable: true
    ArtifactFileEntry:
      type: "object"
      properties:
        path:
          type: "string"
          nullable: true
        size:
          type: "integer"
          format: "int64"
          nullable: true
        checksum:
          nullable: true
          $ref: "#/components/schemas/ArtifactChecksum"
        executable:
          type: "boolean"
          nullable: true
    DeniedScope:
      type: "object"
      properties:
        scope:
          type: "string"
          nullable: true
        reason:
          type: "string"
          nullable: true
    ArtifactScopeDeclaration:
      type: "object"
      properties:
        requestedScopes:
          type: "array"
          nullable: true
          items:
            type: "string"
        inferredScopes:
          type: "array"
          nullable: true
          items:
            type: "string"
        approvedScopes:
          type: "array"
          nullable: true
          items:
            type: "string"
        deniedScopes:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/DeniedScope"
    ArtifactAssessmentSummary:
      type: "object"
      properties:
        status:
          type: "string"
          nullable: true
        scanners:
          type: "array"
          nullable: true
          items:
            type: "string"
        findingCount:
          type: "integer"
          format: "int32"
          nullable: true
        summary:
          type: "string"
          nullable: true
    ArtifactRecord:
      type: "object"
      properties:
        coordinate:
          nullable: true
          $ref: "#/components/schemas/ArtifactCoordinate"
        type:
          type: "string"
          nullable: true
          enum:
            - "TOOL_MODULE"
            - "GENERATED_TOOL_MODULE"
            - "CLI_HARNESS"
            - "AVAILABILITY_ANNOTATION"
            - "AVAILABILITY_POLICY"
            - "SCOPE_POLICY"
            - "SECURITY_POLICY"
            - "JSON_SCHEMA"
            - "SBOM"
            - "ATTESTATION"
            - "TEMPLATE"
            - "RUNTIME_PLUGIN"
        trustStatus:
          type: "string"
          nullable: true
          enum:
            - "RECEIVED"
            - "QUARANTINED"
            - "SCANNING"
            - "REVIEW_PENDING"
            - "APPROVED_TRUSTED"
            - "APPROVED_LIMITED"
            - "REJECTED"
            - "BLOCKED_MALWARE"
            - "BLOCKED_POLICY"
            - "BLOCKED_VULNERABILITY"
            - "SUPERSEDED"
            - "DELETED"
            - "REVOKED"
        artifactUri:
          type: "string"
          nullable: true
        artifactChecksum:
          nullable: true
          $ref: "#/components/schemas/ArtifactChecksum"
        files:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/ArtifactFileEntry"
        scopes:
          nullable: true
          $ref: "#/components/schemas/ArtifactScopeDeclaration"
        assessment:
          nullable: true
          $ref: "#/components/schemas/ArtifactAssessmentSummary"
        createdAt:
          type: "string"
          format: "date-time"
          nullable: true
        updatedAt:
          type: "string"
          format: "date-time"
          nullable: true
    ArtifactReviewRequest:
      type: "object"
      properties:
        approvedScopes:
          type: "array"
          nullable: true
          items:
            type: "string"
        deniedScopes:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/DeniedScope"
        trustStatus:
          type: "string"
          nullable: true
          enum:
            - "RECEIVED"
            - "QUARANTINED"
            - "SCANNING"
            - "REVIEW_PENDING"
            - "APPROVED_TRUSTED"
            - "APPROVED_LIMITED"
            - "REJECTED"
            - "BLOCKED_MALWARE"
