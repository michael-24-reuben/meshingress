openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://100.121.15.11:4737
  description: Generated server url
paths:
  /mcp:
    get:
      tags:
      - mcp-controller
      operationId: get
      responses:
        "200":
          description: OK
    post:
      tags:
      - mcp-controller
      summary: Dispatch MCP JSON-RPC requests
      description: "Accepts JSON-RPC 2.0 single requests, notifications, and batches\
        \ for the Meshingress MCP transport."
      operationId: post
      parameters:
      - name: Authorization
        in: header
        description: Bearer admin token for role-gated MCP methods.
        required: false
        schema:
          type: string
        example: Bearer dev-admin
      - name: X-Mcp-Role
        in: header
        description: MCP role hint. Use admin for role-gated registry methods.
        required: false
        schema:
          type: string
        example: admin
      - name: X-Mcp-Admin
        in: header
        description: Legacy admin flag accepted for compatibility.
        required: false
        schema:
          type: string
        example: true
      - name: Mcp-Session-Id
        in: header
        description: Client MCP session identifier.
        required: false
        schema:
          type: string
        example: session-123
      - name: X-Request-Id
        in: header
        description: Caller request correlation identifier.
        required: false
        schema:
          type: string
        example: req-123
      requestBody:
        description: "JSON-RPC 2.0 payload. Use a single request object for ordinary\
          \ calls, omit id for notifications, or send an array of request objects\
          \ for batches."
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/McpInitializeRequest"
              - $ref: "#/components/schemas/McpInitializedNotification"
              - $ref: "#/components/schemas/McpPingRequest"
              - $ref: "#/components/schemas/McpToolsListRequest"
              - $ref: "#/components/schemas/McpToolsCallRequest"
              - $ref: "#/components/schemas/McpRolesToolsCheckRequest"
              - $ref: "#/components/schemas/McpRolesToolsRegisterRequest"
              - $ref: "#/components/schemas/McpRolesToolsInstallPublicationRequest"
              - $ref: "#/components/schemas/McpRolesToolsAliasRequest"
              - $ref: "#/components/schemas/McpRolesToolsUpdateRequest"
              - $ref: "#/components/schemas/McpRolesToolsDeleteRequest"
              - $ref: "#/components/schemas/McpRolesToolsListRequest"
              - $ref: "#/components/schemas/McpRolesToolsReloadRequest"
              - $ref: "#/components/schemas/McpJsonRpcBatchRequest"
            examples:
              tools/list:
                summary: List public tools
                description: tools/list
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/list
                  params: {}
              tools/call:
                summary: Invoke a tool
                description: tools/call
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: helloworld.greet
                    arguments:
                      name: Meshingress
              roles/tools/register:
                summary: Register a phase-aware local JAR tool
                description: roles/tools/register
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: roles/tools/register
                  params:
                    phase: install
                    toolId: sample.local
                    localJar:
                      path: C:/tools/sample.jar
                      checksumSha256: <sha256>
                    replace: false
              batch:
                summary: Batch request
                description: batch
                value:
                - jsonrpc: "2.0"
                  id: 4
                  method: ping
                - jsonrpc: "2.0"
                  id: 5
                  method: tools/list
                  params: {}
        required: true
      responses:
        "200":
          description: JSON-RPC response object or response batch. JSON-RPC method
            failures are represented in the response body error object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
        "204":
          description: Notification-only request or batch produced no JSON-RPC response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
        "415":
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonNode"
    delete:
      tags:
      - mcp-controller
      operationId: delete
      responses:
        "200":
          description: OK
