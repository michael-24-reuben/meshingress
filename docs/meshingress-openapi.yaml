components:
  schemas:
    McpClientInfo:
      type: object
      description: MCP client identity metadata.
      properties:
        name:
          type: string
          description: Client name.
          example: test-client
        version:
          type: string
          description: Client version.
          example: 0.1.0
    McpInitializeParams:
      type: object
      description: MCP initialize parameters.
      properties:
        protocolVersion:
          type: string
          description: Protocol version requested by the client.
          example: 2025-11-25
        capabilities:
          description: Client capabilities object.
          example: {}
        clientInfo:
          $ref: "#/components/schemas/McpClientInfo"
          description: Client identity.
    McpInitializeRequest:
      type: object
      description: Initializes an MCP session and returns server capabilities.
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC protocol version.
          enum:
          - "2.0"
          example: "2.0"
        id:
          description: Client-supplied request identifier.
          example: 1
        method:
          type: string
          description: MCP method name.
          enum:
          - initialize
          example: initialize
        params:
          $ref: "#/components/schemas/McpInitializeParams"
      required:
      - id
      - jsonrpc
      - method
      - params
    McpInitializedNotification:
      type: object
      description: Notification sent after the client accepts initialization. Notifications
        omit id and do not produce a response body.
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC protocol version.
          enum:
          - "2.0"
          example: "2.0"
        method:
          type: string
          description: MCP method name.
          enum:
          - notifications/initialized
          example: notifications/initialized
        params:
          description: Optional notification params.
      required:
      - jsonrpc
      - method
    McpPingRequest:
      type: object
      description: Health-style JSON-RPC ping routed through the MCP dispatcher.
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC protocol version.
          enum:
          - "2.0"
          example: "2.0"
        id:
          description: Client-supplied request identifier.
          example: 2
        method:
          type: string
          description: MCP method name.
          enum:
          - ping
          example: ping
        params:
          description: Optional ping params.
      required:
      - id
      - jsonrpc
      - method
    McpToolsListRequest:
      type: object
      description: Lists public enabled MCP tools.
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC protocol version.
          enum:
          - "2.0"
          example: "2.0"
        id:
          description: Client-supplied request identifier.
          example: 3
        method:
          type: string
          description: MCP method name.
          enum:
          - tools/list
          example: tools/list
        params:
          description: Optional empty object.
          example: {}
      required:
      - id
      - jsonrpc
      - method
    McpToolsCallParams:
      type: object
      description: Parameters for tools/call.
      properties:
        name:
          type: string
          description: Name of the MCP tool function to invoke.
          example: helloworld.greet
        arguments:
          type: object
          additionalProperties: {}
          description: Tool-specific arguments object. Its schema is supplied by tools/list
            for each tool.
          example:
            name: Meshingress
      required:
      - name
    McpToolsCallRequest:
      type: object
      description: Invokes a public MCP tool by function name.
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC protocol version.
          enum:
          - "2.0"
          example: "2.0"
        id:
          description: Client-supplied request identifier.
          example: 4
        method:
          type: string
          description: MCP method name.
          enum:
          - tools/call
          example: tools/call
        params:
          $ref: "#/components/schemas/McpToolsCallParams"
      required:
      - id
      - jsonrpc
      - method
      - params
    McpRolesToolsCheckRequest:
      type: object
      description: Admin request that validates a proposed dynamic tool descriptor.
      properties:
        jsonrpc:
          type: string
          description: JSON-RPC protocol version.
          enum:
          - "2.0"
          example: "2.0"
        id:
          description: Client-supplied request identifier.
          example: 5
        method:
          type: string
          description: MCP method name.
          enum:
          - roles/tools/check
          example: roles/tools/check
        params:
          $ref: "#/components/schemas/RolesToolCheckParams"
      required:
      - id
      - jsonrpc
      - method
      - params
    RolesToolCheckParams:
      type: object
      description: Parameters for roles/tools/check.
      properties:
        tool:
          $ref: "#/components/schemas/ToolDescriptorParams"
          description: Proposed dynamic tool descriptor to validate.
        mode:
          type: string
          description: Validation mode. Use update to validate changes to an existing
            tool.
          enum:
          - create
          - update
          example: create
      required:
      - tool
    ToolDescriptorParams:
      type: object
      description: Dynamic MCP tool descriptor accepted by role-gated registry methods.
      properties:
        name:
          type: string
          description: Public MCP tool name.
          example: architect.entries.copy
