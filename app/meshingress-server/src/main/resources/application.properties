spring.application.name=meshingress
spring.config.import=optional:classpath:artifact.properties,optional:file:.env[.properties]
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
spring.data.jpa.repositories.enabled=false

# HTTP Server Binding
server.address=192.168.1.159
server.port=4737

# Identity
meshingress.identity.name=meshingress
meshingress.identity.instance-id=dev-node-01
meshingress.identity.environment=dev
meshingress.identity.public-base-url=http://192.168.1.159:4737
meshingress.identity.node-role=edge-ingress

# MCP WebSocket Transport
meshingress.mcp.websocket.enabled=true
meshingress.mcp.websocket.path=/mcp/ws
meshingress.mcp.websocket.allowed-origins=*
meshingress.mcp.websocket.max-message-size=1MB
meshingress.mcp.websocket.send-timeout=30s
meshingress.mcp.websocket.idle-timeout=5m
meshingress.mcp.websocket.require-auth=false

# Tool Registry
meshingress.tools.registry.enabled=true
meshingress.tools.registry.fail-on-duplicate-tool-id=true
meshingress.tools.registry.fail-on-invalid-tool-id=true
meshingress.tools.registry.include-disabled=false
meshingress.tools.registry.scan-on-startup=true
meshingress.tools.registry.expose-private-tools=false
meshingress.tools.registration.enabled=true
meshingress.tools.registration.allow-experimental=true
meshingress.tools.registration.allow-staging=true
meshingress.tools.registration.allow-bundle=true
meshingress.tools.registration.allow-native-http=false
meshingress.tools.registration.experimental-replace-existing=true
meshingress.tools.registration.allow-experimental-override-bundle=false
meshingress.tools.registration.allow-experimental-override-staging=true
meshingress.tools.registration.allow-staging-override-bundle=false
meshingress.tools.registration.allow-override-native=false
meshingress.tools.registration.staging-conflict-policy=replace-existing
meshingress.tools.registration.local-jar-root=tools/lib
meshingress.tools.registration.bundle-pom-path=app/meshingress-tool-bundle/pom.xml
meshingress.tools.registration.require-local-jar-checksum=true
meshingress.tools.registration.require-maven-version-pin=true
meshingress.tools.registration.require-approval-for-dynamic-phases=true
meshingress.tools.allow-list=
meshingress.tools.deny-list=
meshingress.tools.default-timeout=30s
meshingress.tools.default-audit=true
meshingress.tools.default-debug-trace=false

# Dispatch
meshingress.dispatch.default-timeout=30s
meshingress.dispatch.max-concurrent-calls=32
meshingress.dispatch.queue-capacity=256
meshingress.dispatch.reject-when-saturated=true
meshingress.dispatch.include-stacktrace=false
meshingress.dispatch.include-generated-at=true
meshingress.dispatch.redact-errors=true

# Documentation
meshingress.documentation.enabled=true
meshingress.documentation.dispatch.enabled=true
meshingress.documentation.dispatch.json-path=/v3/dispatch-docs
meshingress.documentation.dispatch.yaml-path=/v3/dispatch-docs.yaml
meshingress.documentation.dispatch.target-modules=app/meshingress-server
meshingress.documentation.dispatch.scan-base-packages=dev.mrk.meshingress
meshingress.documentation.dispatch.title=Meshingress MCP Dispatch API
meshingress.documentation.dispatch.version=v0
meshingress.documentation.openapi.enabled=true
meshingress.documentation.openapi.json-path=/v3/openapi-docs
meshingress.documentation.openapi.yaml-path=/v3/openapi-docs.yaml
meshingress.documentation.refresh.enabled=true
meshingress.documentation.refresh.dispatch-output=docs/meshingress-dispatch.yaml
meshingress.documentation.refresh.openapi-output=docs/meshingress-openapi.yaml

# Declarative MCP result cache
meshingress.cache.enabled=true
meshingress.cache.location=.cache/meshingress
meshingress.cache.default-storage=file
meshingress.cache.directory=${meshingress.cache.location}/cache
meshingress.cache.default-ttl=5m
meshingress.cache.max-ttl=1h
meshingress.cache.max-entry-size=1MB
meshingress.cache.max-total-size=256MB
meshingress.cache.create-directories=true
meshingress.cache.cleanup-on-startup=true

# Ephemeral physical-content storage
meshingress.storage.enabled=true
# Placement for bytes Meshingress owns. Delegated-source tools bypass this lifecycle.
meshingress.storage.lifecycle=local-local
meshingress.storage.max-entry-size=256MB
meshingress.storage.local.root=${meshingress.cache.location}/storage
meshingress.storage.local.max-entries=1024
meshingress.storage.local.staging.max-bytes=256MB
meshingress.storage.local.staging.ttl=15m
meshingress.storage.local.published.max-bytes=1GB
meshingress.storage.local.published.default-ttl=30m
meshingress.storage.local.published.max-ttl=24h
meshingress.storage.local.published.default-max-requests=1
meshingress.storage.local.published.max-requests=50
meshingress.storage.local.published.max-concurrent-retrievals=32
meshingress.storage.local.cleanup.interval=5m
meshingress.storage.local.cleanup.batch-size=100
# Required only for lifecycle=local-external (Meshingress-owned local bytes).
meshingress.storage.external.default-target=
# Optional Nextcloud destination for tool-requested delegated HTTPS source URLs.
meshingress.storage.external.delegated-target=nextcloud-primary
meshingress.storage.external.access-mode=write-only
meshingress.storage.external.mutation-policy=create-only
meshingress.storage.external.conflict-policy=fail
meshingress.storage.external.retention-policy=provider-managed
meshingress.storage.external.max-concurrent-uploads=8
meshingress.storage.external.upload-timeout=30m
meshingress.storage.external.async-handoff.worker-interval=5s
meshingress.storage.external.async-handoff.lease-duration=35m
meshingress.storage.external.async-handoff.max-attempts=8
meshingress.storage.external.async-handoff.initial-retry-delay=5s
meshingress.storage.external.async-handoff.max-retry-delay=5m
meshingress.storage.metadata.sql.schema=meshingress
meshingress.storage.metadata.sql.table-prefix=storage_
meshingress.storage.metadata.sql.table.entries=storage_entries
meshingress.storage.metadata.sql.table.usage=storage_usage
meshingress.storage.metadata.sql.table.events=storage_events
meshingress.storage.metadata.sql.initialize-schema=true

# Nextcloud delegated-workspace OCS target
meshingress.storage.external.targets.nextcloud-primary.provider=nextcloud
meshingress.storage.external.targets.nextcloud-primary.enabled=true

# The OCS reservation API uses the base endpoint. base-path remains available only for legacy WebDAV migration.
meshingress.storage.external.targets.nextcloud-primary.endpoint=https://alphasunny-xps-8700.tail93ea23.ts.net
# This folder must be pre-created; write-only handoff does not probe or create it.
meshingress.storage.external.targets.nextcloud-primary.base-path=/remote.php/dav/files/alphasunny/Workspace/Meshingress/storage

# Environment variable must contain the full Authorization value:
# Basic <base64(USERNAME:APP_PASSWORD)>
meshingress.storage.external.targets.nextcloud-primary.credential-ref=env:NEXTCLOUD_PRIMARY_AUTH

# The Nextcloud app owns OPEN -> SEALED -> queued source-import staging.
meshingress.storage.external.targets.nextcloud-primary.staging-mode=provider-session

# Repository Integration
meshingress.repository.runtime-cache-root=${meshingress.cache.location}/runtime-tools
meshingress.repository.runtime-registration-store-path=runtime/tool-registrations.json
meshingress.repository.api-base-url=
meshingress.repository.api-role=publisher

# Security
meshingress.security.enabled=true
meshingress.security.mode=dev
meshingress.security.require-authentication=false
# Transitional local-test adapter. It is disabled outside dev mode and does not
# accept X-Mcp-Role or X-Mcp-Admin; production must use a verified identity provider.
meshingress.security.legacy-development-token-enabled=true
meshingress.security.development-admin-token=dev-admin
meshingress.security.require-tool-approval=false
meshingress.security.require-approval-for-privileged=true
meshingress.security.require-approval-for-critical=true
meshingress.security.deny-unknown-scopes=true
meshingress.security.default-deny=true
# OIDC is deliberately off for the local development profile. Production must
# configure an issuer and exact audience; management routes reject dev tokens.
meshingress.security.oidc.enabled=${MESHINGRESS_SECURITY_OIDC_ENABLED:false}
meshingress.security.oidc.issuer-uri=${MESHINGRESS_SECURITY_OIDC_ISSUER_URI:https://accounts.google.com}
meshingress.security.oidc.audience=${MESHINGRESS_SECURITY_OIDC_AUDIENCE:}
meshingress.security.oidc.tenant-claim=tenant_id
meshingress.security.oidc.profile-id-claim=profile_id
meshingress.security.oidc.roles-claim=roles
meshingress.security.oidc.grants-claim=scope
# Profile admission remains closed until an operator deliberately enables a
# provider-neutral mode and sets a tenant. Profiles created through self-service
# are unprivileged and pending review by default.
meshingress.security.admission.mode=CLOSED
meshingress.security.admission.default-tenant-id=
meshingress.security.admission.initial-profile-status=PENDING_REVIEW
# Limits are opt-in deployment policy. A zero default is an explicit unlimited
# global baseline; per-profile policies may narrow it.
meshingress.security.limits.enabled=false
meshingress.security.limits.record-usage=false
meshingress.security.limits.requests-per-window=0
meshingress.security.limits.request-window=1m
meshingress.security.limits.tool-executions-per-window=0
meshingress.security.limits.tool-execution-window=1m
meshingress.security.limits.max-concurrent-calls=0

# Scope Policy
meshingress.scopes.audit-required-for-high-risk=true
meshingress.scopes.explicit-approval-for-critical=true
meshingress.scopes.allow-shell-execute=true
meshingress.scopes.allow-files-delete=false
meshingress.scopes.allow-network-inbound=true

# Audit
meshingress.audit.enabled=true
meshingress.audit.log-tool-calls=true
meshingress.audit.log-tool-results=false
meshingress.audit.log-arguments=true
meshingress.audit.redact-secrets=true
meshingress.audit.storage=log
meshingress.audit.max-argument-length=8192

# Secrets
meshingress.secrets.enabled=true
meshingress.secrets.allow-env=true
meshingress.secrets.allow-file=false
meshingress.secrets.allow-inline=false
meshingress.secrets.redaction-placeholder=****
meshingress.secrets.fail-on-missing=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# Logging
logging.level.dev.mrk.meshingress=INFO
logging.level.dev.mrk.meshingress.dispatch=DEBUG
logging.level.dev.mrk.meshingress.tools=INFO

#
