spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=256MB

# Repository storage root. Runtime directories are created under this root:
# artifacts, metadata, indexes, quarantine, reviews, sbom,
# attestations, signatures, and publications.
meshingress.repository.root=repository
meshingress.repository.signing-secret=dev-repository-signing-key
meshingress.repository.signing-key-id=local-dev-hmac
meshingress.repository.provenance-generated-by=meshingress-repository
meshingress.repository.scope-scanner-enabled=true
meshingress.repository.scope-catalog-location=classpath:/scope-rules/default-bytecode-scope-catalog.json
meshingress.repository.scanner-pipeline.required-scanners=cyclonedx-sbom,embedded-jar-sandbox,bytecode-scope-scanner
meshingress.repository.scanner-pipeline.optional-scanners=
meshingress.repository.scanner-pipeline.default-timeout=30s
meshingress.repository.scanner-pipeline.failure-policy=block
meshingress.repository.grype.executable=grype
meshingress.repository.grype.block-severity-threshold=critical
meshingress.repository.grype.review-severity-threshold=low
meshingress.repository.grype.max-output-chars=262144
meshingress.repository.raw-report-retention.policy=retain-with-artifact
meshingress.repository.raw-report-retention.location=artifact-assessment-directory
meshingress.repository.raw-report-retention.scanner-reports=true
meshingress.repository.raw-report-retention.sandbox-reports=true
meshingress.repository.sandbox.enabled=true
meshingress.repository.sandbox.scanner-name=embedded-jar-sandbox
meshingress.repository.sandbox.scanner-version=static-1
meshingress.repository.sandbox.strategy=static-quarantine-inspection
meshingress.repository.publication-eligibility.enabled=true
meshingress.repository.publication-eligibility.minimum-reviewer-approvals=1
meshingress.repository.publication-eligibility.required-scanners=
meshingress.repository.publication-eligibility.required-provenance-fields=generatedBy
meshingress.repository.publication-eligibility.trusted-builders=
meshingress.repository.publication-eligibility.trusted-signing-key-ids=
meshingress.repository.publication-eligibility.revoked-signing-key-ids=

# Canonical repository metadata store. SQL is the only active implementation in
# this slice; raw scanner/SBOM reports still remain on the repository filesystem.
meshingress.repository.metadata-store=sql
meshingress.repository.sql.schema=meshingress
meshingress.repository.sql.table-prefix=repository_
meshingress.repository.sql.table.artifacts=repository_artifacts
meshingress.repository.sql.table.artifact-files=repository_artifact_files
meshingress.repository.sql.table.assessments=repository_assessments
meshingress.repository.sql.table.publications=repository_publications
meshingress.repository.sql.table.lifecycle-events=repository_lifecycle_events
meshingress.repository.sql.initialize-schema=true

spring.datasource.url=jdbc:h2:file:./repository/sql/meshingress-repository
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

logging.level.sootup.callgraph.AbstractCallGraphAlgorithm=ERROR
logging.level.sootup.core.typehierarchy.TypeHierarchy=ERROR
